services:
  # Neo4j
  neo4j:
    image: neo4j:latest
    container_name: spirit-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - spirit-network


  # Patient app (Next.js)
  patient:
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient
    ports:
      - "25250:3000"
    env_file:
      - ./apps/patient/env.docker
    depends_on:
      - neo4j
    networks:
      - spirit-network


  # Visualizer app (Next.js)
  visualizer:
    build:
      context: ./apps/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "25260:3000"
    volumes:
      - ./apps/visualizer:/app
      - /app/node_modules
    command: pnpm run dev
    env_file:
      - ./apps/visualizer/env.docker
    depends_on:
      - neo4j
    networks:
      - spirit-network

  # Unified Pipeline app (Python)
  pipeline:
    build:
      context: .
      dockerfile: ./apps/pipeline/Dockerfile
    container_name: spirit-pipeline
    ports:
      - "8000:8000"
    environment:
      - HUME_API=q0nGzfOSBZB4D0HbdZorGxek3wXz5O4XpTG8IkEJ0gY8Wlet
      - HUME_API_KEY=LYSOLhalcwGNDdqxtlZOE4172bXGTzg0VxV30BatjXJPUtAULQ6ZoZmyBVTQE19s
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - NEO4J_DATABASE=neo4j
    depends_on:
      - neo4j
    volumes:
      - ./dataset:/app/dataset
    networks:
      - spirit-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  spirit-network:
    driver: bridge
