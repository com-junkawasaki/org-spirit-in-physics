services:
  # Participant app (Next.js)
  participant:
    build:
      context: .
      dockerfile: ./performers/systems/ParticipantApplication/src/Dockerfile
    container_name: spirit-participant
    ports:
      - "25250:25250"
    volumes:
      - ./performers/systems/ParticipantApplication/src:/app/performers/systems/ParticipantApplication/src
      - ./performers/services/ports/types:/app/performers/services/ports/types
      - /app/performers/systems/ParticipantApplication/src/node_modules
    env_file:
      - ./performers/systems/ParticipantApplication/src/env.docker
    networks:
      - spirit-network


  # Researcher app (Next.js)
  researcher:
    build:
      context: .
      dockerfile: ./performers/systems/ResearcherApplication/src/Dockerfile
    container_name: spirit-researcher
    ports:
      - "25260:3000"
    volumes:
      - ./performers/systems/ResearcherApplication/src:/app/performers/systems/ResearcherApplication/src
      - ./performers/services/ports/types:/app/performers/services/ports/types
      - /app/performers/systems/ResearcherApplication/src/node_modules
      - ./dataset:/app/performers/systems/ResearcherApplication/src/dataset:cached
    command: pnpm run dev
    env_file:
      - ./performers/systems/ResearcherApplication/src/env.docker
    environment:
      - NODE_ENV=development
      - INNGEST_EVENT_KEY=local_dev_key
      - INNGEST_SIGNING_KEY=local_dev_signing_key
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    networks:
      - spirit-network

  # GraphQL Server (Rust)
  graphql:
    build:
      context: .
      dockerfile: ./performers/services/graphql/GraphQLService/Dockerfile
    container_name: spirit-graphql
    ports:
      - "25263:3003"
    volumes:
      - ./performers/services/graphql/GraphQLService:/app/performers/services/graphql/GraphQLService
      - ./activities:/app/activities
      - /app/performers/services/graphql/GraphQLService/target  # Build cache
      - /app/activities/target  # Activities build cache
    env_file:
      - ./performers/services/graphql/GraphQLService/env.docker
    environment:
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      - PORT=3003
      - RUST_LOG=info
    networks:
      - spirit-network
    restart: unless-stopped

