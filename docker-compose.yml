  # One-shot importer to push dataset into PostgreSQL via Rust import service
  import-service-runner:
    image: curlimages/curl:8.9.1
    container_name: spirit-import-service-runner
    depends_on:
      postgres:
        condition: service_healthy
      import-service:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      'set -euo pipefail;
       echo "Triggering participants import (Rust service)";
       curl -sS -X POST http://import-service:8082/import/participants || exit 1;
       echo "Triggering sessions import (Rust service)";
       curl -sS -X POST http://import-service:8082/import/sessions || exit 1;
       echo "Triggering emotions import (Rust service)";
       curl -sS -X POST http://import-service:8082/import/emotions || exit 1;
       echo "Rust import service imports completed";'
    networks:
      - spirit-network
    restart: "no"

