# Spirit in Physics - Complete System Integration
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=spirit_in_physics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Axon Server for Event Sourcing
  axonserver:
    image: axoniq/axonserver:latest
    ports:
      - "8024:8024"  # HTTP port
      - "8124:8124"  # gRPC port
    environment:
      - AXONSERVER_HOSTNAME=axonserver
    volumes:
      - axonserver-data:/data
      - axonserver-events:/eventdata
      - axonserver-log:/log
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Temporal Server for Workflow Orchestration
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"  # gRPC port
      - "8233:8233"  # HTTP port
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/data
      - ./apps/analyzer-temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "tctl", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Analyzer Temporal API Server
  analyzer-temporal-api:
    build: ./apps/analyzer-temporal
    container_name: analyzer-temporal-api
    ports:
      - "8081:8081"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./apps/analyzer-temporal:/app
      - ./apps/analyzer-temporal/results:/app/results
      - ./apps/analyzer-temporal/visualizations:/app/visualizations
    depends_on:
      - temporal
    networks:
      - spirit-network
    command: python api_server.py --host 0.0.0.0 --port 8081

  # Axon Framework Backend (Kotlin/Spring Boot)
  backend:
    build: ./apps/backend
    container_name: spirit-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/spirit_in_physics
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - TEMPORAL_SERVER_HOST=temporal
      - TEMPORAL_SERVER_PORT=7233
      - ANALYZER_TEMPORAL_URL=http://analyzer-temporal-api:8081
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Visualizer Frontend (Next.js)
  visualizer:
    build: ./apps/visualizer
    container_name: spirit-visualizer
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=http://backend:8080/api
      - BACKEND_API_URL=http://backend:8080/api
    volumes:
      - ./apps/visualizer:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Admin Dashboard (Vite/React)
  admin:
    build: ./apps/admin
    container_name: spirit-admin
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - spirit-network

  # Patient App (Next.js)
  patient:
    build: ./apps/patient
    container_name: spirit-patient
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./apps/patient:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - spirit-network

volumes:
  postgres-data:
    driver: local
  axonserver-data:
    driver: local
  axonserver-events:
    driver: local
  axonserver-log:
    driver: local
  temporal-data:
    driver: local

networks:
  spirit-network:
    driver: bridge