services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: spirit-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./performers/services/graphql/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GraphQL API (Rust)
  graphql:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
    container_name: spirit-graphql
    ports:
      - "8080:8080"
    volumes:
      - ./performers/services/graphql/src:/app/src:cached
      - ./performers/services/graphql/migrations:/app/migrations:cached
      - ./performers/services/graphql/diesel.toml:/app/diesel.toml
      - ./performers/services/graphql/schema.graphql:/app/schema.graphql
      - ./performers/services/graphql/entrypoint.sh:/entrypoint.sh:cached
    environment:
      # Connect to PostgreSQL database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - RUST_LOG=info,sqlx=warn,hyper=info,diesel=debug
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Researcher Actor (Next.js)
  researcher:
    build:
      context: ./performers/actors/researcher
      dockerfile: Dockerfile
    container_name: spirit-researcher
    ports:
      - "3000:3000"
    volumes:
      - ./performers/actors/researcher/src:/app/src:cached
      - ./performers/actors/researcher/public:/app/public:cached
      - ./performers/actors/researcher/package.json:/app/package.json:cached
      - ./performers/actors/researcher/codegen.yaml:/app/codegen.yaml:cached
      - ./performers/services/graphql/schema.graphql:/app/schema.graphql:cached
      - ./performers/actors/researcher/src/generated:/app/src/generated:cached
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/workspace:cached
    environment:
      - NEXT_PUBLIC_GRAPHQL_RUST_API_URL=http://graphql:8080/graphql
      - GRAPHQL_RUST_API_URL=http://graphql:8080/graphql
      - NODE_ENV=development
      - PROJECT_ROOT=/workspace
    env_file:
      - ./performers/actors/researcher/env.docker
    depends_on:
      graphql:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Visualizer Actor (Next.js)
  visualizer:
    build:
      context: ./performers/actors/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "3001:3000"
    volumes:
      - ./performers/actors/visualizer/src:/app/src:cached
      - ./performers/actors/visualizer/public:/app/public:cached
      - ./performers/actors/visualizer/package.json:/app/package.json:cached
      - ./performers/actors/visualizer/codegen.yaml:/app/codegen.yaml:cached
      - ./performers/services/graphql/schema.graphql:/app/schema.graphql:cached
      - ./performers/actors/visualizer/src/generated:/app/src/generated:cached
    environment:
      - NEXT_PUBLIC_GRAPHQL_RUST_API_URL=http://graphql:8080/graphql
      - NODE_ENV=development
    env_file:
      - ./performers/actors/visualizer/env.docker
    depends_on:
      graphql:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Participant Actor (Next.js)
  participant:
    build:
      context: ./performers/actors/participant
      dockerfile: Dockerfile
    container_name: spirit-participant
    ports:
      - "25250:25250"
    volumes:
      - ./performers/actors/participant/src:/app/src:cached
      - ./performers/actors/participant/public:/app/public:cached
      - ./performers/actors/participant/package.json:/app/package.json:cached
      - ./performers/actors/participant/codegen.yaml:/app/codegen.yaml:cached
      - ./performers/services/graphql/schema.graphql:/app/schema.graphql:cached
      - ./performers/actors/participant/src/generated:/app/src/generated:cached
    environment:
      - NEXT_PUBLIC_GRAPHQL_RUST_API_URL=http://graphql:8080/graphql
      - NODE_ENV=development
    env_file:
      - ./performers/actors/participant/env.docker
    depends_on:
      graphql:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:25250"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Importer Service (Rust)
  importer:
    build:
      context: ./performers/services/importer
      dockerfile: Dockerfile
    container_name: spirit-importer
    volumes:
      - ./performers/services/importer/src:/app/src:cached
      - ./performers/services/importer/Cargo.toml:/app/Cargo.toml:cached
      - ./performers/actors/researcher/public/dataset:/app/dataset:ro
      - ./performers/services/importer/target:/app/target:cached
    environment:
      # Connect to PostgreSQL database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - RUST_LOG=info,diesel=debug
    networks:
      - spirit-network
    # Run as a one-off command, not as a service
    profiles:
      - importer

  # Timeline Batch Service (Rust)
  timeline-batch:
    build:
      context: ./performers/services/timeline-batch
      dockerfile: Dockerfile
    container_name: spirit-timeline-batch
    volumes:
      - ./performers/services/timeline-batch/src:/app/src:cached
      - ./performers/services/timeline-batch/Cargo.toml:/app/Cargo.toml:cached
      - ./performers/services/timeline-batch/target:/app/target:cached
    environment:
      # Connect to PostgreSQL database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - RUST_LOG=info,timeline_batch=debug
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    # Run as a one-off command, not as a service
    profiles:
      - batch

networks:
  spirit-network:
    driver: bridge

volumes:
  postgres_data:
