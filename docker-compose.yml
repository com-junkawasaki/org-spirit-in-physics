services:
  # GraphQL API (Rust)
  # Note: Supabase database must be started separately via `supabase start` command
  # Run: cd performers/systems/supabase && supabase start
  # Supabase database will be available at localhost:54322
  graphql:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
    container_name: spirit-graphql
    ports:
      - "8080:8080"
    volumes:
      - ./performers/services/graphql/src:/app/src:cached
      - ./performers/services/graphql/migrations:/app/migrations:cached
      - ./performers/services/graphql/diesel.toml:/app/diesel.toml
      - ./performers/services/graphql/schema.graphql:/app/schema.graphql
    environment:
      # Connect to Supabase database (started via `supabase start`)
      # Supabase DB port: 54322 (config: performers/systems/supabase/config.toml)
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - RUST_LOG=info,sqlx=warn,hyper=info,diesel=debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  spirit-network:
    driver: bridge
