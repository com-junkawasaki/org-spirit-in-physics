services:
  # ArangoDB
  arangodb:
    image: arangodb:latest
    container_name: spirit-arangodb
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=root
      - ARANGO_NO_AUTH=1
    volumes:
      - arangodb_data:/var/lib/arangodb3
    networks:
      - spirit-network


  # Patient app (Next.js)
  patient:
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient
    ports:
      - "25250:3000"
    env_file:
      - ./apps/patient/env.docker
    depends_on:
      - arangodb
    networks:
      - spirit-network

  # Admin app (Vite/React) - DISABLED: app not found
  # admin:
  #   build:
  #     context: ./apps/admin
  #     dockerfile: Dockerfile
  #   container_name: spirit-admin
  #   ports:
  #     - "4173:4173"
  #   env_file:
  #     - ./apps/admin/env.docker
  #   depends_on:
  #     - arangodb
  #   networks:
  #     - spirit-network

  # Visualizer app (Next.js)
  visualizer:
    build:
      context: ./apps/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "25260:3000"
    volumes:
      - ./apps/visualizer:/app
      - /app/node_modules
    command: pnpm run dev
    env_file:
      - ./apps/visualizer/env.docker
    depends_on:
      - arangodb
    networks:
      - spirit-network

  # Unified Pipeline app (Python)
  pipeline:
    build:
      context: .
      dockerfile: ./apps/pipeline/Dockerfile
    container_name: spirit-pipeline
    ports:
      - "8000:8000"
    environment:
      - HUME_API=q0nGzfOSBZB4D0HbdZorGxek3wXz5O4XpTG8IkEJ0gY8Wlet
      - HUME_API_KEY=LYSOLhalcwGNDdqxtlZOE4172bXGTzg0VxV30BatjXJPUtAULQ6ZoZmyBVTQE19s
      - ARANGODB_URL=http://arangodb:8529
      - ARANGODB_USER=root
      - ARANGODB_PASSWORD=root
      - ARANGODB_DATABASE=spirit_in_physics
    depends_on:
      - arangodb
    volumes:
      - ./dataset:/app/dataset
    networks:
      - spirit-network

volumes:
  arangodb_data:

networks:
  spirit-network:
    driver: bridge
