services:
  # Participant app (Next.js)
  participant:
    build:
      context: .
      dockerfile: ./performers/systems/ParticipantApplication/src/Dockerfile
    container_name: spirit-participant
    ports:
      - "25250:25250"
    volumes:
      - ./performers/systems/ParticipantApplication/src:/app/performers/systems/ParticipantApplication/src
      - ./performers/services/ports/types:/app/performers/services/ports/types
      - /app/performers/systems/ParticipantApplication/src/node_modules
    env_file:
      - ./performers/systems/ParticipantApplication/src/env.docker
    networks:
      - spirit-network


  # Researcher app (Next.js)
  researcher:
    build:
      context: .
      dockerfile: ./performers/systems/ResearcherApplication/src/Dockerfile
    container_name: spirit-researcher
    ports:
      - "25260:3000"
    volumes:
      - ./performers/systems/ResearcherApplication/src:/app/performers/systems/ResearcherApplication/src
      - ./performers/services/ports/types:/app/performers/services/ports/types
      - /app/performers/systems/ResearcherApplication/src/node_modules
      - ./dataset:/app/performers/systems/ResearcherApplication/src/dataset:cached
    command: pnpm run dev
    env_file:
      - ./performers/systems/ResearcherApplication/src/env.docker
    environment:
      - NODE_ENV=development
      - INNGEST_EVENT_KEY=local_dev_key
      - INNGEST_SIGNING_KEY=local_dev_signing_key
    networks:
      - spirit-network

  # GraphQL Server (Rust)
  graphql:
    build:
      context: ./performers/services/graphql/GraphQLService
      dockerfile: Dockerfile
    container_name: spirit-graphql
    ports:
      - "25263:3003"
    env_file:
      - ./performers/services/graphql/GraphQLService/env.docker
    networks:
      - spirit-network
    restart: unless-stopped

  # BPMN Runner (optional orchestrator for imports)
