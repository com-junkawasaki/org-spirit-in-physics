services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: spirit-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GraphQL API (Rust)
  graphql:
    build:
      context: ./apps/graphql
      dockerfile: Dockerfile
    container_name: spirit-graphql
    ports:
      - "8080:8080"
    volumes:
      - ./apps/graphql/src:/app/src:cached
      - ./apps/graphql/migrations:/app/migrations:cached
      - ./apps/graphql/diesel.toml:/app/diesel.toml
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - RUST_LOG=info,sqlx=warn,hyper=info,diesel=debug
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  spirit-network:
    driver: bridge
