services:
  # Participant app (Next.js)
  participant:
    build:
      context: ./apps/participant
      dockerfile: Dockerfile
    container_name: spirit-participant
    ports:
      - "25250:3000"
    env_file:
      - ./apps/participant/env.docker
    networks:
      - spirit-network


  # Researcher app (Next.js)
  researcher:
    build:
      context: ./apps/researcher
      dockerfile: Dockerfile
    container_name: spirit-researcher
    ports:
      - "25260:3000"
    volumes:
      - ./apps/researcher:/app
      - /app/node_modules
      - ./dataset:/app/dataset:cached
    command: pnpm run dev
    env_file:
      - ./apps/researcher/env.docker
    environment:
      - NODE_ENV=development
      - INNGEST_EVENT_KEY=local_dev_key
      - INNGEST_SIGNING_KEY=local_dev_signing_key
    networks:
      - spirit-network

  # BPMN Runner (optional orchestrator for imports)
  bpmn-runner:
        build:
          context: ./apps/pipeline/services/bpmn_runner
          dockerfile: Dockerfile
        container_name: spirit-bpmn-runner
        environment:
          - API_BASE=http://researcher:3000
          - PARTICIPANT_IDS=2a0d7a69-f953-4c29-87a5-8a8e4e8bd413
        depends_on:
          - researcher
        networks:
          - spirit-network
        restart: "no"

networks:
  spirit-network:
    driver: bridge
