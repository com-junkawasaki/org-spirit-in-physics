version: '3.8'

services:
    # MinIO Object Storage Server
    minio:
      image: minio/minio:latest
      container_name: spirit-minio
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        - MINIO_ACCESS_KEY=minioadmin
        - MINIO_SECRET_KEY=minioadmin
        - MINIO_ROOT_USER=minioadmin
        - MINIO_ROOT_PASSWORD=minioadmin
      volumes:
        - minio-data:/data
      networks:
        - spirit-network
      command: server /data --console-address ":9001"
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 30s
        timeout: 10s
        retries: 5

    # MinIO Client for bucket initialization
    minio-init:
      image: minio/mc:latest
      container_name: minio-init
      depends_on:
        minio:
          condition: service_healthy
      networks:
        - spirit-network
      entrypoint: ["/bin/sh", "-c"]
      command: |
        /usr/bin/mc config host add spirit-minio http://minio:9000 minioadmin minioadmin &&
        /usr/bin/mc mb spirit-minio/spirit-files --ignore-existing &&
        /usr/bin/mc mb spirit-minio/spirit-analysis --ignore-existing &&
        /usr/bin/mc mb spirit-minio/spirit-videos --ignore-existing &&
        /usr/bin/mc mb spirit-minio/spirit-results --ignore-existing &&
        /usr/bin/mc anonymous set public spirit-minio/spirit-files &&
        /usr/bin/mc anonymous set public spirit-minio/spirit-analysis &&
        /usr/bin/mc anonymous set download spirit-minio/spirit-results &&
        echo "MinIO buckets initialized successfully"

    # PostgreSQL Database
    postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=spirit_in_physics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

    # Axon Server for Event Sourcing
    axonserver:
    image: axoniq/axonserver:latest
    ports:
      - "8024:8024"  # HTTP port
      - "8124:8124"  # gRPC port
    environment:
      - AXONSERVER_HOSTNAME=axonserver
    volumes:
      - axonserver-data:/data
      - axonserver-events:/eventdata
      - axonserver-log:/log
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Temporal Server for Workflow Orchestration
    temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"  # gRPC port
      - "8233:8233"  # HTTP port
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=postgres:5432
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/data
      - ./apps/analyzer-temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "tctl", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Analyzer Temporal API Server
    analyzer-temporal-api:
    build: ./apps/analyzer-temporal
    container_name: analyzer-temporal-api
    ports:
      - "8081:8081"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./apps/analyzer-temporal:/app
      - ./apps/analyzer-temporal/results:/app/results
      - ./apps/analyzer-temporal/visualizations:/app/visualizations
    depends_on:
      - temporal
    networks:
      - spirit-network
    command: python api_server.py --host 0.0.0.0 --port 8081

  # Axon Framework Backend (Kotlin/Spring Boot)
    backend:
    build: ./apps/backend
    container_name: spirit-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AXON_AXONSERVER_SERVERS=axonserver:8124
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/spirit_in_physics
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - TEMPORAL_SERVER_HOST=temporal
      - TEMPORAL_SERVER_PORT=7233
      - ANALYZER_TEMPORAL_URL=http://analyzer-temporal-api:8081
      # MinIO Configuration
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_FILES=spirit-files
      - MINIO_BUCKET_ANALYSIS=spirit-analysis
      - MINIO_BUCKET_VIDEOS=spirit-videos
      - MINIO_BUCKET_RESULTS=spirit-results
    depends_on:
      axonserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Visualizer Frontend (Next.js)
    visualizer:
    build: ./apps/visualizer
    container_name: spirit-visualizer
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_MINIO_ENDPOINT=http://localhost:9000
      - NEXT_PUBLIC_MINIO_ACCESS_KEY=minioadmin
      - NEXT_PUBLIC_MINIO_SECRET_KEY=minioadmin
      - NEXT_PUBLIC_MINIO_BUCKET_ANALYSIS=spirit-analysis
      - NEXT_PUBLIC_MINIO_BUCKET_RESULTS=spirit-results
    depends_on:
      - backend
      - minio
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Patient App (Next.js)
    patient:
    build: ./apps/patient
    container_name: spirit-patient
    ports:
      - "25260:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_MINIO_ENDPOINT=http://localhost:9000
      - NEXT_PUBLIC_MINIO_ACCESS_KEY=minioadmin
      - NEXT_PUBLIC_MINIO_SECRET_KEY=minioadmin
      - NEXT_PUBLIC_MINIO_BUCKET_FILES=spirit-files
      - NEXT_PUBLIC_MINIO_BUCKET_VIDEOS=spirit-videos
    depends_on:
      - backend
      - minio
    networks:
      - spirit-network

volumes:
  postgres-data:
    driver: local
  axonserver-data:
    driver: local
  axonserver-events:
    driver: local
  axonserver-log:
    driver: local
  temporal-data:
    driver: local
  minio-data:
    driver: local

networks:
  spirit-network:
    driver: bridge