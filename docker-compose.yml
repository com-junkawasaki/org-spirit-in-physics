services:
  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: spirit-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=spirit_in_physics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - spirit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Patient app (Next.js)
  patient:
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient
    ports:
      - "25250:25250"
    volumes:
      - ./apps/visualizer/public/dataset:/app/dataset:cached
    env_file:
      - ./apps/patient/env.docker
    depends_on:
      postgres:
        condition: service_healthy
      graphql-service:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:25250" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  # Visualizer app (Next.js)
  visualizer:
    build:
      context: ./apps/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "25260:3000"
    volumes:
      - ./apps/visualizer:/app
      - /app/node_modules
      - ./dataset:/app/dataset:cached
    command: pnpm run dev
    env_file:
      - ./apps/visualizer/env.docker
    environment:
      - NODE_ENV=development
      - INNGEST_EVENT_KEY=local_dev_key
      - INNGEST_SIGNING_KEY=local_dev_signing_key
      - GRAPHQL_API_URL=http://graphql-service:8081/graphql
    depends_on:
      postgres:
        condition: service_healthy
      graphql-service:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Patient app for cloud (Aura) profile
  patient-cloud:
    profiles: ["cloud"]
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient-cloud
    ports:
      - "25251:25250"
    volumes:
      - ./apps/visualizer/public/dataset:/app/dataset:cached
    env_file:
      - ./apps/patient/env.docker
    environment:
      - NEO4J_URI=neo4j+s://539ac6ec.databases.neo4j.io:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ZApfDTJmpJAmBpMXgCHWn826CV69dE9_ntxtPHUc7hI
      - NEO4J_DATABASE=neo4j
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:25250" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: sh -lc "rm -f .env.local && pnpm dev"

  # Rust import service
  import-service:
    build:
      context: ./performers/services/import
      dockerfile: Dockerfile
    container_name: spirit-import-service
    ports:
      - "8082:8082"
    volumes:
      - ./apps/visualizer/public/dataset:/app/dataset:cached
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/spirit_in_physics
      - DATASET_PATH=/app/dataset/participants
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/import/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GraphQL service (Rust + async-graphql)
  graphql-service:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
    container_name: spirit-graphql-service
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/spirit_in_physics
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot importer to push dataset into PostgreSQL via Rust import service
  import-service-runner:
    image: curlimages/curl:8.9.1
    container_name: spirit-import-service-runner
    depends_on:
      postgres:
        condition: service_healthy
      import-service:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      'set -euo pipefail;
       echo "Triggering participants import (Rust service)";
       curl -sS -X POST http://import-service:8082/import/participants || exit 1;
       echo "Triggering sessions import (Rust service)";
       curl -sS -X POST http://import-service:8082/import/sessions || exit 1;
       echo "Triggering emotions import (Rust service)";
       curl -sS -X POST http://import-service:8082/import/emotions || exit 1;
       echo "Rust import service imports completed";'
    networks:
      - spirit-network
    restart: "no"

  # BPMN Runner (optional orchestrator for imports)
  # bpmn-runner:
  #       build:
  #         context: ./apps/pipeline/services/bpmn_runner
  #         dockerfile: Dockerfile
  #       container_name: spirit-bpmn-runner
  #       environment:
  #         - API_BASE=http://visualizer:3000
  #         - PARTICIPANT_IDS=2a0d7a69-f953-4c29-87a5-8a8e4e8bd413
  #       depends_on:
  #         - visualizer
  #       networks:
  #         - spirit-network
  #       restart: "no"

  # One-shot importer for cloud (Aura)
  patient-cloud-importer:
    profiles: ["cloud"]
    image: curlimages/curl:8.9.1
    container_name: spirit-patient-cloud-importer
    depends_on:
      patient-cloud:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      'set -euo pipefail;
       echo "Triggering participants import (cloud)";
       curl -sS -X POST http://patient-cloud:25250/api/admin/import/participants || exit 1;
       echo "Triggering sessions import (cloud)";
       curl -sS -X POST http://patient-cloud:25250/api/admin/import/sessions || exit 1;
       echo "Triggering emotions import (cloud)";
       curl -sS -X POST http://patient-cloud:25250/api/admin/import/emotions || exit 1;
       echo "Cloud imports completed";'
    networks:
      - spirit-network
    restart: "no"

volumes:
  postgres_data:

networks:
  spirit-network:
    driver: bridge
    name: spirit-network-v2
