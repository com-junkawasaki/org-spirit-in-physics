services:
  # Patient app (Next.js)
  patient:
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient
    ports:
      - "25250:3000"
    env_file:
      - ./apps/patient/env.docker
    networks:
      - spirit-network


  # Visualizer app (Next.js)
  visualizer:
    build:
      context: ./apps/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "25260:3000"
    volumes:
      - ./apps/visualizer:/app
      - /app/node_modules
      - ./dataset:/app/dataset:cached
    command: pnpm run dev
    env_file:
      - ./apps/visualizer/env.docker
    environment:
      - NODE_ENV=development
      - INNGEST_EVENT_KEY=local_dev_key
      - INNGEST_SIGNING_KEY=local_dev_signing_key
    networks:
      - spirit-network

  # BPMN Runner (optional orchestrator for imports)
  bpmn-runner:
        build:
          context: ./apps/pipeline/services/bpmn_runner
          dockerfile: Dockerfile
        container_name: spirit-bpmn-runner
        environment:
          - API_BASE=http://visualizer:3000
          - PARTICIPANT_IDS=2a0d7a69-f953-4c29-87a5-8a8e4e8bd413
        depends_on:
          - visualizer
        networks:
          - spirit-network
        restart: "no"

networks:
  spirit-network:
    driver: bridge
