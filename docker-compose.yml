  # Python import service
  import-service:
    build:
      context: ./performers/services/import
      dockerfile: Dockerfile
    container_name: spirit-import-service
    ports:
      - "8082:8082"
    volumes:
      - ./apps/researcher/public/dataset:/app/dataset:cached
    environment:
      # Production Supabase Database URL
      # Format: postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
      # Get from Supabase Dashboard > Project Settings > Database > Connection string > Transaction mode
      # For local development, use local PostgreSQL container
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/spirit_in_physics
      - DATASET_PATH=/app/dataset/participants
      - PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/import/status')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GraphQL service (Rust + async-graphql)
  graphql-service:
    build:
      context: ./performers/services/graphql
      dockerfile: Dockerfile
    container_name: spirit-graphql-service
    ports:
      - "8081:8081"
    environment:
      # Production Supabase Database URL (Connection pooler - IPv4 compatible)
      # Format: postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
      # Get from Supabase Dashboard > Project Settings > Database > Connection string > Transaction mode
      # Note: Using pooler to avoid IPv6 connectivity issues in Docker
      # For local development, use local PostgreSQL container (override .envrc)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/spirit_in_physics
      - RUST_LOG=info
      # Production Supabase Configuration
      - SUPABASE_URL=${SUPABASE_URL:-https://pxsuqemlayhnmcxuiigk.supabase.co}
      # Production Supabase Service Role Key
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4c3VxZW1sYXlobm1jeHVpaWdrIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1MDUxNjk3MiwiZXhwIjoyMDY2MDkyOTcyfQ.7KSDYa5pxYCiA_ZtTe_8KPGBKELdj0buxba2nG7EnJc}
      # Storage bucket name (from supabase/migrations/20241004000003_storage_policies.sql)
      - SUPABASE_STORAGE_BUCKET=spirit-in-physics
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgweb - PostgreSQL Web Management Interface
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: spirit-pgweb
    ports:
      - "8083:8081"
    environment:
      - PGWEB_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/spirit_in_physics?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spirit-network
    restart: unless-stopped

  # SvelteKit app (unified app)
  svelte:
    build:
      context: ./apps/svelte
      dockerfile: Dockerfile.dev
    container_name: spirit-svelte
    ports:
      - "3000:3000"
    volumes:
      - ./apps/svelte:/app
      - ./packages:/app/../packages
      - svelte_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # HMR and file watching settings for Docker
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      # GraphQL API URL
      - GRAPHQL_API_URL=http://graphql-service:8081/graphql
      - PUBLIC_GRAPHQL_API_URL=http://localhost:8081/graphql
      # Clerk Authentication
      - PUBLIC_CLERK_PUBLISHABLE_KEY=${PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      # Supabase Configuration
      - PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL:-https://pxsuqemlayhnmcxuiigk.supabase.co}
      - PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4c3VxZW1sYXlobm1jeHVpaWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA1MTY5NzIsImV4cCI6MjA2NjA5Mjk3Mn0.CoFBY4BZLhiiSFZL-PpRyZDJFoNNnMoXg4BtwT76NWs}
    command: sh -c "rm -rf .svelte-kit && pnpm install && pnpm svelte-kit sync && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
      graphql-service:
        condition: service_healthy
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

