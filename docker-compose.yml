version: '3.8'

services:
  # ArangoDB
  arangodb:
    image: arangodb:latest
    container_name: spirit-arangodb
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=root
      - ARANGO_NO_AUTH=1
    volumes:
      - arangodb_data:/var/lib/arangodb3
    networks:
      - spirit-network

  # Temporal
  temporal:
    image: temporalio/auto-setup:latest
    container_name: spirit-temporal
    ports:
      - "7233:7233"  # Temporal server
      - "8233:8233"  # Temporal UI
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=temporal-postgres:5432
    depends_on:
      - temporal-postgres
    networks:
      - spirit-network

  temporal-postgres:
    image: postgres:13
    container_name: spirit-temporal-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - temporal_data:/var/lib/postgresql/data
    networks:
      - spirit-network

  # Patient app (Next.js)
  patient:
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient
    ports:
      - "25250:3000"
    env_file:
      - ./apps/patient/env.docker
    depends_on:
      - arangodb
    networks:
      - spirit-network

  # Admin app (Vite/React)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: spirit-admin
    ports:
      - "4173:4173"
    env_file:
      - ./apps/admin/env.docker
    depends_on:
      - arangodb
    networks:
      - spirit-network

  # Visualizer app (Next.js)
  visualizer:
    build:
      context: ./apps/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "25260:3000"
    env_file:
      - ./apps/visualizer/env.docker
    depends_on:
      - arangodb
    networks:
      - spirit-network

  # Analyzer app (Python)
  analyzer:
    build:
      context: ./apps/analyzer
      dockerfile: Dockerfile
    container_name: spirit-analyzer
    ports:
      - "8000:8000"
    env_file:
      - ./apps/analyzer/env.docker
    depends_on:
      - arangodb
    networks:
      - spirit-network

  # Importer app (Python)
  importer:
    build:
      context: ./apps/importer
      dockerfile: Dockerfile
    container_name: spirit-importer
    ports:
      - "8001:8001"
    env_file:
      - ./apps/importer/env.docker
    depends_on:
      - temporal
      - arangodb
    volumes:
      - ./dataset:/app/dataset
    networks:
      - spirit-network

volumes:
  temporal_data:
  arangodb_data:

networks:
  spirit-network:
    driver: bridge
