services:
  # Neo4j
  neo4j:
    image: neo4j:latest
    container_name: spirit-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4jpassword", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  # Patient app (Next.js)
  patient:
    build:
      context: ./apps/patient
      dockerfile: Dockerfile
    container_name: spirit-patient
    ports:
      - "25250:3000"
    env_file:
      - ./apps/patient/env.docker
    depends_on:
      - neo4j
    networks:
      - spirit-network


  # Visualizer app (Next.js)
  visualizer:
    build:
      context: ./apps/visualizer
      dockerfile: Dockerfile
    container_name: spirit-visualizer
    ports:
      - "25260:3000"
    volumes:
      - ./apps/visualizer:/app
      - ./apps/visualizer/node_modules:/app/node_modules
    command: pnpm run dev
    env_file:
      - ./apps/visualizer/env.docker
    depends_on:
      - neo4j
    networks:
      - spirit-network

  # Storage Adapter Service
  storage-adapter:
        build:
          context: .
          dockerfile: ./apps/pipeline/services/storage_adapter/Dockerfile
        container_name: spirit-storage-adapter
        ports:
          - "8004:8004"
        environment:
          - NEO4J_URI=neo4j://neo4j:7687
          - NEO4J_USER=neo4j
          - NEO4J_PASSWORD=neo4jpassword
          - SERVICE_VERSION=1.0.0
        depends_on:
          neo4j:
            condition: service_healthy
        volumes:
          - ./dataset:/app/dataset
        networks:
          - spirit-network
        restart: unless-stopped

  # Data Ingestion Service
  data-ingestion:
        build:
          context: .
          dockerfile: ./apps/pipeline/services/data_ingestion/Dockerfile
        container_name: spirit-data-ingestion
        ports:
          - "8001:8001"
        environment:
          - SERVICE_VERSION=1.0.0
        depends_on:
          - storage-adapter
        volumes:
          - ./dataset:/app/dataset
        networks:
          - spirit-network
        restart: unless-stopped

  # Analysis Engine Service
  analysis-engine:
        build:
          context: .
          dockerfile: ./apps/pipeline/services/analysis_engine/Dockerfile
        container_name: spirit-analysis-engine
        ports:
          - "8002:8002"
        environment:
          - HUME_API_KEY=${HUME_API_KEY:-mock-key}
          - SERVICE_VERSION=1.0.0
        depends_on:
          - storage-adapter
        networks:
          - spirit-network
        restart: unless-stopped

  # Workflow Orchestrator Service
  workflow-orchestrator:
        build:
          context: .
          dockerfile: ./apps/pipeline/services/workflow_orchestrator/Dockerfile
        container_name: spirit-workflow-orchestrator
        ports:
          - "8003:8003"
        environment:
          - SERVICE_VERSION=1.0.0
        depends_on:
          - data-ingestion
          - analysis-engine
          - storage-adapter
        networks:
          - spirit-network
        restart: unless-stopped

  # API Gateway Service (Unified Pipeline API)
  pipeline:
        build:
          context: .
          dockerfile: ./apps/pipeline/services/api_gateway/Dockerfile
        container_name: spirit-pipeline
        ports:
          - "8000:8000"
        environment:
          - HUME_API_KEY=${HUME_API_KEY:-mock-key}
          - SERVICE_VERSION=1.0.0
        depends_on:
          - workflow-orchestrator
          - data-ingestion
          - analysis-engine
          - storage-adapter
        networks:
          - spirit-network
        restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  spirit-network:
    driver: bridge
