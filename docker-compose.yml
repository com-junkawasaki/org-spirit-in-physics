services:
  # Participant app (Next.js)
  participant:
    build:
      context: .
      dockerfile: ./apps/participant/Dockerfile
    container_name: spirit-participant
    ports:
      - "25250:3000"
    volumes:
      - ./apps/participant:/app/apps/participant
      - ./packages:/app/packages
      - /app/node_modules
    env_file:
      - ./apps/participant/env.docker
    networks:
      - spirit-network


  # Researcher app (Next.js)
  researcher:
    build:
      context: .
      dockerfile: ./apps/researcher/Dockerfile
    container_name: spirit-researcher
    ports:
      - "25260:3000"
    volumes:
      - ./apps/researcher:/app/apps/researcher
      - ./packages:/app/packages
      - /app/node_modules
      - ./dataset:/app/apps/researcher/dataset:cached
    command: pnpm run dev
    env_file:
      - ./apps/researcher/env.docker
    environment:
      - NODE_ENV=development
      - INNGEST_EVENT_KEY=local_dev_key
      - INNGEST_SIGNING_KEY=local_dev_signing_key
    networks:
      - spirit-network

