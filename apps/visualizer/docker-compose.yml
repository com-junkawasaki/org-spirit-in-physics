version: '3.8'

services:
  visualizer:
    build: .
    container_name: spirit-visualizer
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=http://backend:8080/api
      - BACKEND_API_URL=http://backend:8080/api
    depends_on:
      - backend
    networks:
      - spirit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  spirit-network:
    external: true
