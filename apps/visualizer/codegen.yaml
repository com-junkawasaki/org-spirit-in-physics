# GraphQL Code Generator configuration
# Generates TypeScript types and operations from Rust GraphQL service SDL

schema:
  - graphql-schema.graphql

documents:
  - 'src/**/*.{ts,tsx}'
  - 'src/**/*.graphql'
  - 'packages/visualization-components/src/**/*.graphql'
  - '!src/generated/**'

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-graphql-request
      - typed-document-node
    config:
      # Use const assertions for better type inference
      constEnums: true
      # Generate enums as TypeScript enums
      enumsAsTypes: true
      # Use string literal types for scalars
      scalars:
        ID: string
        DateTime: string
        JSON: any
      # Skip type checking for generated files
      skipTypename: false
      # Use typed document nodes
      documentMode: string
      # Generate hooks for React (if needed)
      withHooks: false
      # Generate fragments
      dedupeFragments: true
      # Generate operation names
      operationResultSuffix: Result
      # Generate input types
      inputMaybeValue: T | null | undefined
      # Use graphql-request client
      rawRequest: false
  src/generated/graphql-apollo.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      constEnums: true
      enumsAsTypes: true
      scalars:
        ID: string
        DateTime: string
        JSON: any
      skipTypename: false
      documentMode: documentNode
      dedupeFragments: true
      operationResultSuffix: Result
      inputMaybeValue: T | null | undefined

