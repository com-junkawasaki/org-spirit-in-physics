# GraphQL queries and mutations
# These will be used by GraphQL Code Generator to generate TypeScript types

query GetParticipants {
  participants {
    id
    age
    gender
    handedness
    createdAt
    updatedAt
  }
}

query GetParticipant($id: ID!) {
  participant(id: $id) {
    id
    age
    gender
    handedness
    createdAt
    updatedAt
  }
}

query GetSessions($participantId: ID!) {
  sessions(participantId: $participantId) {
    id
    participantId
    sessionIndex
    startTs
    endTs
    events
    createdAt
    updatedAt
  }
}

query GetTimeline(
  $participantId: ID!
  $sessionId: ID
  $startTime: String
  $endTime: String
  $interval: String
) {
  timeline(
    participantId: $participantId
    sessionId: $sessionId
    startTime: $startTime
    endTime: $endTime
    interval: $interval
  ) {
    time
    participantId
    sessionId
    word
    eventType
    reactionValue
    reactionTime
    hasResponse
    emotions {
      name
      score
      fileType
    }
    physiological
    metadata
  }
}

query GetWordAggregates(
  $participantId: ID!
  $sessionId: ID
) {
  wordAggregates(
    participantId: $participantId
    sessionId: $sessionId
  ) {
    participantId
    sessionId
    word
    count
    avgReactionValue
    sumReactionValue
    avgReactionTime
    sumReactionTime
    avgPhysiological
    sumPhysAbs
    physSeries
    rtSeries
    rvSeries
    firstTime
    lastTime
  }
}

query GetEmotionVectors(
  $participantId: ID!
  $sessionId: ID
) {
  emotionVectors(
    participantId: $participantId
    sessionId: $sessionId
  ) {
    participantId
    sessionId
    word
    joySum
    sadnessSum
    angerSum
    fearSum
    surpriseSum
    disgustSum
    calmSum
    focusSum
    excitementSum
    confusionSum
    emotionEntryCount
    emotionByModality
  }
}

query GetWordStatistics(
  $participantId: ID!
  $sessionId: ID
) {
  wordStatistics(
    participantId: $participantId
    sessionId: $sessionId
  ) {
    participantId
    sessionId
    word
    count
    avgReactionTime
    stdReactionTime
    varReactionTime
    avgReactionValue
    stdReactionValue
    varReactionValue
    avgPhysiological
    stdPhysiological
    varPhysiological
    speedIndex
    physSeries
    rtSeries
  }
}

