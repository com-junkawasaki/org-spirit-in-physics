subscription ForceGraphUpdates($simulationId: String!, $maxFps: Int) {
  forceGraphUpdates(simulationId: $simulationId, maxFps: $maxFps) {
    simulationId
    timestamp
    iteration
    nodes {
      id
      position {
        x
        y
        z
      }
      velocity {
        x
        y
        z
      }
    }
  }
}

mutation CreateForceGraphSimulation($input: ForceGraphSimulationInput!) {
  createForceGraphSimulation(input: $input)
}

mutation UpdateForceGraphPhysics($simulationId: String!, $physics: PhysicsParamsInput!) {
  updateForceGraphPhysics(simulationId: $simulationId, physics: $physics)
}

mutation StopForceGraphSimulation($simulationId: String!) {
  stopForceGraphSimulation(simulationId: $simulationId)
}

