
type EmotionData {
  name: String!
  score: Float!
  fileType: String!
  color: String
}

type PhysiologicalData {
  measurementType: String!
  value: Float!
  timestamp: String!
}

type EmotionVector {
	participantId: ID!
	sessionId: ID!
	word: String!
	joySum: Float
	sadnessSum: Float
	angerSum: Float
	fearSum: Float
	surpriseSum: Float
	disgustSum: Float
	calmSum: Float
	focusSum: Float
	excitementSum: Float
	confusionSum: Float
	emotionEntryCount: Int!
	emotionByModality: JSON
}




"""
A scalar that can represent any JSON value.
"""
scalar JSON

type Mutation {
	"""
	Create a new participant
	"""
	createParticipant: String!
	"""
	Create a new force graph simulation
	"""
	createForceGraphSimulation(input: ForceGraphSimulationInput!): String!
	"""
	Update physics parameters for a simulation
	"""
	updateForceGraphPhysics(simulationId: String!, physics: PhysicsParamsInput!): Boolean!
	"""
	Stop and remove a simulation
	"""
	stopForceGraphSimulation(simulationId: String!): Boolean!
}

type Participant {
	id: ID!
	age: Int
	gender: String
	handedness: String
	createdAt: String!
	updatedAt: String!
}

type Query {
	"""
	Get all participants
	"""
	participants: [Participant!]!
	"""
	Get a participant by ID
	"""
	participant(id: ID!): Participant
	"""
	Get sessions for a participant
	"""
	sessions(participantId: ID!): [Session!]!
	"""
	Get timeline data for a participant and optional session
	"""
	timeline(participantId: ID!, sessionId: ID, startTime: String, endTime: String, interval: String): [TimelinePoint!]!
	"""
	Get word aggregates by session (from materialized view)
	This provides pre-aggregated data for efficient client-side processing
	"""
	wordAggregates(participantId: ID!, sessionId: ID): [WordAggregate!]!
	"""
	Get emotion vectors by word (from materialized view)
	This provides pre-aggregated emotion data for efficient vector operations
	"""
	emotionVectors(participantId: ID!, sessionId: ID): [EmotionVector!]!
	"""
	Get word statistics by session (from materialized view)
	This provides pre-calculated statistics for efficient client-side processing
	"""
	wordStatistics(participantId: ID!, sessionId: ID): [WordStatistics!]!
}

type Session {
	id: ID!
	participantId: ID!
	sessionIndex: Int
	startTs: Int!
	endTs: Int
	events: [JSON!]!
	createdAt: String!
	updatedAt: String!
}


type TimelinePoint {
	time: String!
	participantId: ID!
	sessionId: ID!
	word: String
	eventType: String
	reactionValue: Float
	reactionTime: Float
	hasResponse: Boolean!
	emotions: [EmotionData!]!
  physiological: JSON!
	metadata: JSON!
}

type WordAggregate {
	participantId: ID!
	sessionId: ID!
	word: String!
	count: Int!
	avgReactionValue: Float
	sumReactionValue: Float
	avgReactionTime: Float
	sumReactionTime: Float
	avgPhysiological: Float
	sumPhysAbs: Float
	physSeries: [Float]
	rtSeries: [Float]
	rvSeries: [Float]
	firstTime: String!
	lastTime: String!
}

type WordStatistics {
	participantId: ID!
	sessionId: ID!
	word: String!
	count: Int!
	avgReactionTime: Float
	stdReactionTime: Float
	varReactionTime: Float
	avgReactionValue: Float
	stdReactionValue: Float
	varReactionValue: Float
	avgPhysiological: Float
	stdPhysiological: Float
	varPhysiological: Float
	speedIndex: Float
	physSeries: [Float]
	rtSeries: [Float]
}

type Vec3 {
	x: Float!
	y: Float!
	z: Float!
}

type NodePosition {
	id: String!
	position: Vec3!
	velocity: Vec3!
}

type ForceGraphUpdate {
	simulationId: String!
	timestamp: String!
	nodes: [NodePosition!]!
	iteration: Int!
}

input Vec3Input {
	x: Float!
	y: Float!
	z: Float!
}

input NodeInput {
	id: String!
	label: String!
	scale: Float!
	axis: Vec3Input
	fixed: Boolean
	initial: Vec3Input
	color: String
}

input LinkInput {
	source: Int!
	target: Int!
	weight: Float!
	mode: String
	l0: Float
	k: Float
}

input PhysicsParamsInput {
	springK: Float
	repulsionK: Float
	damping: Float
	restLength: Float
	maxSpeed: Float
	shellRadius: Float
	shellK: Float
	shellRadiusOuter: Float
	shellKOuter: Float
	radialOutK: Float
	minSep: Float
	sepK: Float
	constraintIters: Int
	constraintStiffness: Float
}

input ForceGraphSimulationInput {
	nodes: [NodeInput!]!
	links: [LinkInput!]!
	physics: PhysicsParamsInput
	maxFps: Int
}

type Subscription {
	forceGraphUpdates(simulationId: String!, maxFps: Int): ForceGraphUpdate!
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
