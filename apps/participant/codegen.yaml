# GraphQL Code Generator configuration
# Schema-first approach: Uses SDL file from server
# Generates TypeScript types and operations from GraphQL SDL

schema:
  - graphql-schema.graphql
  # Alternative: Use introspection endpoint (uncomment to use live schema)
  # - ${GRAPHQL_API_URL:-http://localhost:8081/graphql}

documents: 'src/**/*.{ts,tsx,graphql,gql}'
generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      useIndexSignature: true
      skipTypename: false
      enumsAsTypes: true
      scalars:
        ID: string
        DateTime: string
        JSON: any
