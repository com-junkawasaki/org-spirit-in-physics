version: '3.8'

services:
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - CASSANDRA_SEEDS=cassandra
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      - cassandra
    networks:
      - spirit-network

  cassandra:
    container_name: temporal-cassandra
    image: cassandra:3.11
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=temporal
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - spirit-network

  analyzer-temporal-api:
    build: .
    container_name: analyzer-temporal-api
    ports:
      - "8081:8081"
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./results:/app/results
      - ./visualizations:/app/visualizations
    depends_on:
      - temporal
    networks:
      - spirit-network
    command: python api_server.py --host 0.0.0.0 --port 8081

volumes:
  cassandra_data:

networks:
  spirit-network:
    driver: bridge
