# Configuration for the Spirit in Physics Analysis Pipeline

supabase:
  url: "YOUR_SUPABASE_URL"
  service_role_key: "YOUR_SUPABASE_SERVICE_ROLE_KEY"

hume_ai:
  api_key: "YOUR_HUME_AI_API_KEY"

model_params:
  alpha: 1.0      # Weight for reaction time component r(w_I, w_O)
  gamma: 1.0      # Weight for skin potential component ΔSP(w_I, w_O)
  eta: 1.0        # Weight for emotion component F(w_I, w_O)
  lambda: 1.0     # Scaling parameter for skin potential
  epsilon: 0.001  # Small constant to avoid division by zero in reaction time

word2vec:
  model_path: "path/to/your/word2vec.model"

processing:
  max_concurrent_jobs: 3    # Maximum number of Hume AI jobs to run concurrently
  job_timeout_seconds: 600  # Timeout for Hume AI job completion (10 minutes)
  temp_dir: "/tmp/spirit-analysis"  # Directory for temporary file downloads
