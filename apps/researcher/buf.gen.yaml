version: v2
plugins:
  # TypeScript code generation (Protobuf-ES)
  - remote: buf.build/bufbuild/es
    out: src/generated/proto
    opt:
      - import_extension=none
      - target=ts
  
  # Connect-ES code generation (for Connect RPC clients)
  - remote: buf.build/connectrpc/es
    out: src/generated/proto
    opt:
      - target=ts
