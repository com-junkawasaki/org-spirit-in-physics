# GraphQL Schema
# Merkle DAG: graphql.schema.graphql
# OWL: spirit:GraphQL Service Port schema

scalar JSON

type Participant {
  id: ID!
  age: Int
  gender: String
  handedness: String
  createdAt: String!
  updatedAt: String!
}

type Session {
  id: ID!
  participantId: ID!
  sessionId: ID!
  sessionType: String!
  startTime: String!
  endTime: String
  createdAt: String!
  updatedAt: String!
}

type AnalysisResult {
  id: ID!
  participantId: ID!
  experimentId: ID!
  wordStimulusId: Int!
  stimulusWord: String!
  responseWord: String!
  reactionTimeMs: Int
  spiritProbability: Float!
  word2vecComponent: Float
  reactionTimeComponent: Float
  skinPotentialComponent: Float
  emotionComponent: Float
  emotionData: JSON
  physiologicalData: JSON
  createdAt: String!
  updatedAt: String!
}

type ActivityExecutionResponse {
  success: Boolean!
  result: JSON
  error: String
}

type Query {
  participants: [Participant!]!
  participant(id: ID!): Participant
  sessions(participantId: ID): [Session!]!
  analysisResults(participantId: ID, experimentId: ID): [AnalysisResult!]!
}

type Mutation {
  executeActivity(activityId: String!, inputs: JSON!): ActivityExecutionResponse!
  analyzeParticipant(participantId: ID!, experimentId: ID): ActivityExecutionResponse!
}

