# Development overrides for Dev Containers
version: '3.8'

services:
  # Override dev-backend to include additional development tools
  dev-backend:
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELoad_ENABLED=true
    volumes:
      - ./apps/backend:/app
      - /app/build
      - /app/.gradle
      # Add gradle cache for faster builds
      - ~/.gradle:/root/.gradle:cached

  # Ensure postgres is accessible for development
  postgres:
    ports:
      - "5432:5432"

  # Make sure all frontend apps can be accessed during development
  visualizer:
    ports:
      - "3003:25260"

  admin:
    ports:
      - "3001:3000"

  patient:
    ports:
      - "3002:25250"

  analyzer-temporal-api:
    ports:
      - "8081:8081"
