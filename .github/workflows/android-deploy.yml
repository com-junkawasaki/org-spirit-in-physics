name: Android Deploy

on:
  push:
    tags:
      - 'android/v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - beta
          - production

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: |
          cd apps/svelte-app
          pnpm build

      - name: Sync Capacitor
        run: |
          cd apps/mobile
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > apps/mobile/android/key.properties << EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Create Google Play credentials
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY" > apps/mobile/android/fastlane/play-store-credentials.json

      - name: Deploy to Internal Testing
        if: github.event.inputs.track == 'internal' || startsWith(github.ref, 'refs/tags/android/v')
        run: |
          cd apps/mobile/android
          bundle exec fastlane internal

      - name: Deploy to Beta
        if: github.event.inputs.track == 'beta'
        run: |
          cd apps/mobile/android
          bundle exec fastlane beta

      - name: Deploy to Production
        if: github.event.inputs.track == 'production'
        run: |
          cd apps/mobile/android
          bundle exec fastlane release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f apps/mobile/android/fastlane/play-store-credentials.json
          rm -f apps/mobile/android/app/release.keystore
          rm -f apps/mobile/android/key.properties
