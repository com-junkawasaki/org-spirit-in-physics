version: '3'

tasks:
  apply-local:
    desc: Apply manifests to local cluster
    cmds:
      - kubectl apply -f manifests/overlays/local/all.yaml

  push-manifest:
    desc: Push static manifests to Artifact Registry for Config Sync
    cmds:
      - gcloud artifacts oci upload --source=manifests/overlays/gke --image=asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/manifests:latest

  nix-build-portal:
    desc: Build portal image with Docker and apply locally
    cmds:
      - docker build -t asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/svelte-app:latest ./apps/svelte-app
      - task: apply-local

