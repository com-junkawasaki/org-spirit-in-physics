version: '3'

tasks:
  architecture:
    desc: Show the active Cloudflare-native architecture plan
    cmds:
      - sed -n '1,220p' docs/cloudflare-native-architecture.md

  archive-location:
    desc: Show where the Kubernetes assets were archived
    cmds:
      - printf 'archive/kubernetes\n'

  db-migrate-local:
    desc: Apply local D1 migrations for the Cloudflare Worker API
    dir: apps/api-worker
    cmds:
      - pnpm db:migrate:local

  db-migrate-remote:
    desc: Apply remote D1 migrations for the Cloudflare Worker API
    dir: apps/api-worker
    cmds:
      - pnpm db:migrate:remote
