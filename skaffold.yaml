apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: spirit-in-physics

profiles:
  - name: local
    build:
      local:
        push: false
        useBuildkit: true
      artifacts:
        - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/www
          context: .
          docker:
            dockerfile: apps/web/Dockerfile
        - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/api
          context: performers/services/api
          docker:
            dockerfile: Dockerfile
        - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/importer
          context: performers/services/importer
          docker:
            dockerfile: Dockerfile
    manifests:
      kustomize:
        paths:
          - manifests/overlays/local

  - name: gke
    build:
      local:
        push: true
        useBuildkit: true
      artifacts:
        - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/www
          context: .
          docker:
            dockerfile: apps/web/Dockerfile
        - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/api
          context: performers/services/api
          docker:
            dockerfile: Dockerfile
        - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/importer
          context: performers/services/importer
          docker:
            dockerfile: Dockerfile
    manifests:
      kustomize:
        paths:
          - manifests/overlays/gke
    deploy:
      kubeContext: gke_com-junkawasaki-sip_asia-northeast1-a_spirit-standard
