apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: spirit-in-physics

build:
  local:
    push: false
  artifacts:
    - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/svelte-app
      context: apps/web
      docker:
        dockerfile: Dockerfile
    - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/researcher
      context: .
      docker:
        dockerfile: apps/researcher/Dockerfile.monorepo
    - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/grpc-service
      context: performers/services/grpc
      docker:
        dockerfile: Dockerfile
    - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/import-service
      context: performers/services/import
      docker:
        dockerfile: Dockerfile
    - image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/temporal-ts
      context: performers/services/temporal-ts
      docker:
        dockerfile: Dockerfile

manifests:
  rawYaml:
    - manifests/base/namespace.yaml
    - manifests/base/serviceaccounts/*.yaml
    - manifests/base/services/*.yaml
    # Use local deployments with localhost API URL
    - manifests/overlays/local/deployments/portal.yaml
    - manifests/overlays/local/deployments/researcher.yaml
    # Other deployments from base
    - manifests/base/deployments/grpc-service.yaml
    - manifests/base/deployments/import-service.yaml
    - manifests/base/deployments/import-worker.yaml
    - manifests/base/deployments/infra-temporal.yaml
    - manifests/base/deployments/temporal-ts.yaml
    - manifests/base/statefulsets/*.yaml

deploy:
  kubectl: {}

portForward:
  - resourceType: service
    resourceName: portal
    namespace: spirit-in-physics
    port: 80
    localPort: 3000
  - resourceType: service
    resourceName: researcher
    namespace: spirit-in-physics
    port: 80
    localPort: 3002
  - resourceType: service
    resourceName: grpc-service
    namespace: spirit-in-physics
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: import-service
    namespace: spirit-in-physics
    port: 8082
    localPort: 8082
  - resourceType: service
    resourceName: infra-temporal
    namespace: spirit-in-physics
    port: 7233
    localPort: 7233
  - resourceType: service
    resourceName: infra-temporal
    namespace: spirit-in-physics
    port: 8088
    localPort: 8088
  - resourceType: service
    resourceName: infra-timescaledb
    namespace: spirit-in-physics
    port: 5432
    localPort: 5432
