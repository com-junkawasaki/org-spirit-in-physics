<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Spirit - Bevy 3D Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #bevy-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            min-width: 250px;
            z-index: 100;
        }
        #controls h2 {
            color: #61dafb;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        .control-group button {
            width: 100%;
            padding: 10px;
            background: #61dafb;
            color: #1e1e1e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .control-group button:hover {
            background: #4fa8c5;
        }
        .control-group button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
            z-index: 100;
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-loading {
            background: #ffa500;
            animation: pulse 1s infinite;
        }
        .status-ready {
            background: #4caf50;
        }
        .status-error {
            background: #f44336;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }
        #loading h1 {
            color: #61dafb;
            margin-bottom: 20px;
        }
        #loading p {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="bevy-canvas"></canvas>
        
        <div id="loading">
            <h1>Loading Bevy Visualization...</h1>
            <p>Initializing WebAssembly module...</p>
        </div>
        
        <div id="controls" style="display: none;">
            <h2>🎮 Bevy 3D Controls</h2>
            <div class="control-group">
                <button onclick="loadData()">データ読み込み</button>
                <button onclick="resetView()">ビューリセット</button>
            </div>
        </div>
        
        <div id="status">
            <span class="status-indicator status-loading" id="statusIndicator"></span>
            <span id="statusText">読み込み中...</span>
        </div>
    </div>

    <script type="module">
        let wasmModule = null;
        let bevyAppStarted = false;

        async function init() {
            try {
                updateStatus('WebAssemblyモジュールを読み込み中...', 'loading');
                
                // Load WebAssembly module
                const wasmUrl = '/wasm/great_sprit.js';
                wasmModule = await import(wasmUrl);
                
                updateStatus('Bevyアプリを初期化中...', 'loading');
                
                // Start Bevy app
                await wasmModule.start_bevy_app('bevy-canvas');
                
                bevyAppStarted = true;
                updateStatus('準備完了', 'ready');
                
                // Hide loading screen and show controls
                document.getElementById('loading').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                
            } catch (error) {
                console.error('Initialization error:', error);
                updateStatus('エラー: ' + error.message, 'error');
                document.getElementById('loading').innerHTML = `
                    <h1 style="color: #ff6b6b;">Initialization Error</h1>
                    <p>${error.message}</p>
                    <p style="margin-top: 20px; font-size: 12px;">Please check:</p>
                    <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                        <li>WebAssembly files are built (run build-wasm.sh)</li>
                        <li>Server is running and serving /wasm/* files</li>
                        <li>Browser console for details</li>
                    </ul>
                `;
            }
        }

        function updateStatus(text, status) {
            document.getElementById('statusText').textContent = text;
            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'status-indicator status-' + status;
        }

        async function loadData() {
            if (!bevyAppStarted) {
                alert('Bevyアプリがまだ初期化されていません');
                return;
            }
            
            try {
                updateStatus('データ読み込み中...', 'loading');
                
                // Load data from GraphQL
                const response = await fetch('/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `{
                            rdfTriples(limit: 100) {
                                subject
                                predicate
                                object
                            }
                            emotionObservations(limit: 50) {
                                personUri
                                valence
                                arousal
                                engagement
                            }
                        }`
                    })
                });
                
                const result = await response.json();
                
                if (result.errors) {
                    throw new Error('GraphQL error: ' + JSON.stringify(result.errors));
                }
                
                // Pass data to Bevy app
                if (result.data.rdfTriples && result.data.rdfTriples.length > 0) {
                    try {
                        await wasmModule.load_rdf_data(JSON.stringify(result.data.rdfTriples));
                        console.log('RDF data loaded into Bevy:', result.data.rdfTriples.length, 'triples');
                    } catch (e) {
                        console.warn('Failed to load RDF data into Bevy:', e);
                    }
                }
                
                if (result.data.emotionObservations && result.data.emotionObservations.length > 0) {
                    try {
                        await wasmModule.load_emotion_data(JSON.stringify(result.data.emotionObservations));
                        console.log('Emotion data loaded into Bevy:', result.data.emotionObservations.length, 'observations');
                    } catch (e) {
                        console.warn('Failed to load emotion data into Bevy:', e);
                    }
                }
                
                updateStatus('データ読み込み完了', 'ready');
            } catch (error) {
                console.error('Error loading data:', error);
                updateStatus('エラー: ' + error.message, 'error');
            }
        }

        function resetView() {
            // TODO: Implement view reset in Bevy app
            console.log('Reset view');
        }

        // Make functions globally available
        window.loadData = loadData;
        window.resetView = resetView;

        // Initialize on page load
        init();
    </script>
</body>
</html>
