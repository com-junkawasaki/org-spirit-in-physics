<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Spirit - 3D Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            min-width: 250px;
            z-index: 100;
        }
        #controls h2 {
            color: #61dafb;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        .control-group select,
        .control-group input {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        .control-group button {
            width: 100%;
            padding: 10px;
            background: #61dafb;
            color: #1e1e1e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .control-group button:hover {
            background: #4fa8c5;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
            z-index: 100;
        }
        .info-item {
            margin: 5px 0;
        }
        .info-label {
            color: #61dafb;
            font-weight: bold;
        }
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
            z-index: 100;
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-connected {
            background: #4caf50;
        }
        .status-disconnected {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="controls">
            <h2>🎮 3D Visualization Controls</h2>
            
            <div class="control-group">
                <label>表示モード</label>
                <select id="viewMode">
                    <option value="rdf">RDF Vector Field</option>
                    <option value="shacl">SHACL Constraints</option>
                    <option value="emotion">Emotion Network</option>
                    <option value="physics">Physics Dynamics</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>カメラモード</label>
                <select id="cameraMode">
                    <option value="orbit">Orbit</option>
                    <option value="fly">Fly</option>
                    <option value="first-person">First Person</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>表示オプション</label>
                <label style="font-weight: normal;">
                    <input type="checkbox" id="showGrid" checked> グリッド表示
                </label>
                <label style="font-weight: normal;">
                    <input type="checkbox" id="showAxes" checked> 軸表示
                </label>
                <label style="font-weight: normal;">
                    <input type="checkbox" id="showLabels"> ラベル表示
                </label>
            </div>
            
            <div class="control-group">
                <button onclick="loadData()">データ読み込み</button>
                <button onclick="resetCamera()">カメラリセット</button>
            </div>
        </div>
        
        <div id="status">
            <div>
                <span class="status-indicator status-disconnected" id="statusIndicator"></span>
                <span id="statusText">接続中...</span>
            </div>
        </div>
        
        <div class="info">
            <div class="info-item">
                <span class="info-label">マウス操作:</span>
                左ドラッグ: 回転 | 右ドラッグ: パン | ホイール: ズーム
            </div>
            <div class="info-item">
                <span class="info-label">キーボード:</span>
                W/A/S/D: 移動 | Q/E: 上下 | R: リセット
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GridHelper } from 'three/addons/helpers/GridHelper.js';
        import { AxesHelper } from 'three/addons/helpers/AxesHelper.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 100;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Helpers
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // Data storage
        let rdfVectors = [];
        let shaclConstraints = [];
        let emotionNodes = [];
        
        // Load data from GraphQL
        async function loadData() {
            updateStatus('データ読み込み中...', false);
            
            try {
                const viewMode = document.getElementById('viewMode').value;
                
                if (viewMode === 'rdf') {
                    await loadRDFData();
                } else if (viewMode === 'emotion') {
                    await loadEmotionData();
                } else {
                    // For other modes, use demo data
                    createDemoData();
                }
                
                updateStatus('データ読み込み完了', true);
            } catch (error) {
                console.error('Error loading data:', error);
                updateStatus('エラー: ' + error.message, false);
            }
        }
        
        // Load RDF triples from GraphQL
        async function loadRDFData() {
            const query = `{
                rdfTriples(limit: 500) {
                    subject
                    predicate
                    object
                }
            }`;
            
            const response = await fetch('/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            
            const result = await response.json();
            
            if (result.errors) {
                console.error('GraphQL errors:', result.errors);
                createDemoData(); // Fallback to demo data
                return;
            }
            
            const triples = result.data?.rdfTriples || [];
            
            if (triples.length === 0) {
                console.warn('No RDF triples found, using demo data');
                createDemoData();
                return;
            }
            
            // Clear existing visualization
            scene.children.filter(child => 
                child.userData.isVisualization
            ).forEach(child => scene.remove(child));
            
            // Create node map and positions
            const nodeMap = new Map();
            const nodePositions = new Map();
            let nodeIndex = 0;
            
            // Collect all unique nodes
            triples.forEach(triple => {
                if (!nodeMap.has(triple.subject)) {
                    const pos = new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    );
                    nodeMap.set(triple.subject, nodeIndex++);
                    nodePositions.set(triple.subject, pos);
                }
                if (!nodeMap.has(triple.object)) {
                    const pos = new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    );
                    nodeMap.set(triple.object, nodeIndex++);
                    nodePositions.set(triple.object, pos);
                }
            });
            
            // Render nodes
            nodePositions.forEach((pos, uri) => {
                const geometry = new THREE.SphereGeometry(0.2, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x61dafb,
                    emissive: 0x001122
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.copy(pos);
                sphere.userData.isVisualization = true;
                sphere.userData.uri = uri;
                scene.add(sphere);
            });
            
            // Render edges (vectors)
            triples.forEach(triple => {
                const startPos = nodePositions.get(triple.subject);
                const endPos = nodePositions.get(triple.object);
                
                if (startPos && endPos) {
                    const direction = new THREE.Vector3().subVectors(endPos, startPos);
                    const length = direction.length();
                    
                    if (length > 0.1) {
                        const geometry = new THREE.BufferGeometry().setFromPoints([
                            startPos,
                            endPos
                        ]);
                        const material = new THREE.LineBasicMaterial({
                            color: 0x888888,
                            transparent: true,
                            opacity: 0.5
                        });
                        const line = new THREE.Line(geometry, material);
                        line.userData.isVisualization = true;
                        scene.add(line);
                    }
                }
            });
        }
        
        // Load emotion observations from GraphQL
        async function loadEmotionData() {
            const query = `{
                emotionObservations(limit: 100) {
                    observationUri
                    personUri
                    valence
                    arousal
                    engagement
                    timestamp
                }
            }`;
            
            const response = await fetch('/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            
            const result = await response.json();
            
            if (result.errors) {
                console.error('GraphQL errors:', result.errors);
                createDemoData(); // Fallback to demo data
                return;
            }
            
            const observations = result.data?.emotionObservations || [];
            
            if (observations.length === 0) {
                console.warn('No emotion observations found, using demo data');
                createDemoData();
                return;
            }
            
            // Clear existing visualization
            scene.children.filter(child => 
                child.userData.isVisualization
            ).forEach(child => scene.remove(child));
            
            // Group observations by person
            const personMap = new Map();
            observations.forEach(obs => {
                if (!personMap.has(obs.personUri)) {
                    personMap.set(obs.personUri, []);
                }
                personMap.get(obs.personUri).push(obs);
            });
            
            // Create network visualization
            const personPositions = new Map();
            let personIndex = 0;
            const angleStep = (Math.PI * 2) / personMap.size;
            
            personMap.forEach((obsList, personUri) => {
                const angle = personIndex * angleStep;
                const radius = 8;
                const pos = new THREE.Vector3(
                    Math.cos(angle) * radius,
                    (personIndex % 3 - 1) * 3,
                    Math.sin(angle) * radius
                );
                personPositions.set(personUri, pos);
                
                // Create person node
                const geometry = new THREE.SphereGeometry(0.5, 16, 16);
                
                // Calculate average emotion values
                const avgValence = obsList.reduce((sum, o) => sum + o.valence, 0) / obsList.length;
                const avgArousal = obsList.reduce((sum, o) => sum + o.arousal, 0) / obsList.length;
                const avgEngagement = obsList.reduce((sum, o) => sum + o.engagement, 0) / obsList.length;
                
                // Color based on emotion
                const color = new THREE.Color();
                color.setHSL(
                    (avgValence + 1) / 2, // Hue based on valence
                    0.8, // Saturation
                    0.5 + avgArousal * 0.3 // Lightness based on arousal
                );
                
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color.clone().multiplyScalar(0.3)
                });
                
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.copy(pos);
                sphere.userData.isVisualization = true;
                sphere.userData.personUri = personUri;
                sphere.userData.observations = obsList.length;
                scene.add(sphere);
                
                // Create observation points around person
                obsList.forEach((obs, idx) => {
                    const offsetAngle = (idx / obsList.length) * Math.PI * 2;
                    const offsetRadius = 1.5;
                    const obsPos = new THREE.Vector3(
                        pos.x + Math.cos(offsetAngle) * offsetRadius,
                        pos.y + (idx / obsList.length - 0.5) * 2,
                        pos.z + Math.sin(offsetAngle) * offsetRadius
                    );
                    
                    const obsGeometry = new THREE.SphereGeometry(0.15, 8, 8);
                    const obsMaterial = new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(
                            (obs.valence + 1) / 2,
                            0.6,
                            0.4 + obs.arousal * 0.3
                        ),
                        transparent: true,
                        opacity: 0.7
                    });
                    const obsSphere = new THREE.Mesh(obsGeometry, obsMaterial);
                    obsSphere.position.copy(obsPos);
                    obsSphere.userData.isVisualization = true;
                    scene.add(obsSphere);
                    
                    // Connect to person
                    const lineGeometry = new THREE.BufferGeometry().setFromPoints([pos, obsPos]);
                    const lineMaterial = new THREE.LineBasicMaterial({
                        color: 0x444444,
                        transparent: true,
                        opacity: 0.2
                    });
                    const line = new THREE.Line(lineGeometry, lineMaterial);
                    line.userData.isVisualization = true;
                    scene.add(line);
                });
                
                personIndex++;
            });
            
            // Connect nearby persons
            const personUris = Array.from(personMap.keys());
            for (let i = 0; i < personUris.length; i++) {
                for (let j = i + 1; j < personUris.length; j++) {
                    const pos1 = personPositions.get(personUris[i]);
                    const pos2 = personPositions.get(personUris[j]);
                    const distance = pos1.distanceTo(pos2);
                    
                    if (distance < 12) {
                        const lineGeometry = new THREE.BufferGeometry().setFromPoints([pos1, pos2]);
                        const lineMaterial = new THREE.LineBasicMaterial({
                            color: 0x666666,
                            transparent: true,
                            opacity: 0.1
                        });
                        const line = new THREE.Line(lineGeometry, lineMaterial);
                        line.userData.isVisualization = true;
                        scene.add(line);
                    }
                }
            }
        }
        
        // Create demo visualization data
        function createDemoData() {
            // Clear existing objects
            scene.children.filter(child => 
                child.userData.isVisualization
            ).forEach(child => scene.remove(child));
            
            const viewMode = document.getElementById('viewMode').value;
            
            if (viewMode === 'rdf') {
                createRDFVisualization();
            } else if (viewMode === 'shacl') {
                createSHACLVisualization();
            } else if (viewMode === 'emotion') {
                createEmotionVisualization();
            } else if (viewMode === 'physics') {
                createPhysicsVisualization();
            }
        }
        
        function createRDFVisualization() {
            // Create RDF vector field visualization
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() - 0.5) * 20;
                const y = (Math.random() - 0.5) * 20;
                const z = (Math.random() - 0.5) * 20;
                
                positions.push(x, y, z);
                
                // Color based on position
                colors.push(
                    (x + 10) / 20,
                    (y + 10) / 20,
                    (z + 10) / 20
                );
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });
            
            const points = new THREE.Points(geometry, material);
            points.userData.isVisualization = true;
            scene.add(points);
        }
        
        function createSHACLVisualization() {
            // Create SHACL constraint visualization
            for (let i = 0; i < 10; i++) {
                const sphereGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                const sphereMaterial = new THREE.MeshStandardMaterial({
                    color: 0xff6b6b,
                    emissive: 0x330000
                });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                
                sphere.position.set(
                    (Math.random() - 0.5) * 15,
                    (Math.random() - 0.5) * 15,
                    (Math.random() - 0.5) * 15
                );
                
                sphere.userData.isVisualization = true;
                scene.add(sphere);
            }
        }
        
        function createEmotionVisualization() {
            // Create emotion network visualization
            const nodes = [];
            for (let i = 0; i < 20; i++) {
                nodes.push({
                    x: (Math.random() - 0.5) * 15,
                    y: (Math.random() - 0.5) * 15,
                    z: (Math.random() - 0.5) * 15,
                    emotion: ['valence', 'arousal', 'engagement'][Math.floor(Math.random() * 3)]
                });
            }
            
            nodes.forEach((node, i) => {
                const geometry = new THREE.SphereGeometry(0.3, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: node.emotion === 'valence' ? 0x61dafb : 
                           node.emotion === 'arousal' ? 0xff6b6b : 0x4caf50
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(node.x, node.y, node.z);
                sphere.userData.isVisualization = true;
                scene.add(sphere);
                
                // Connect to nearby nodes
                nodes.slice(i + 1).forEach(other => {
                    const distance = Math.sqrt(
                        Math.pow(node.x - other.x, 2) +
                        Math.pow(node.y - other.y, 2) +
                        Math.pow(node.z - other.z, 2)
                    );
                    if (distance < 5) {
                        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(node.x, node.y, node.z),
                            new THREE.Vector3(other.x, other.y, other.z)
                        ]);
                        const lineMaterial = new THREE.LineBasicMaterial({
                            color: 0x444444,
                            transparent: true,
                            opacity: 0.3
                        });
                        const line = new THREE.Line(lineGeometry, lineMaterial);
                        line.userData.isVisualization = true;
                        scene.add(line);
                    }
                });
            });
        }
        
        function createPhysicsVisualization() {
            // Create physics dynamics visualization
            const particleCount = 100;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            
            for (let i = 0; i < particleCount; i++) {
                positions.push(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20
                );
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0x61dafb,
                size: 0.2,
                transparent: true,
                opacity: 0.8
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.userData.isVisualization = true;
            particles.userData.positions = positions;
            scene.add(particles);
        }
        
        function updateStatus(text, connected) {
            document.getElementById('statusText').textContent = text;
            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'status-indicator ' + (connected ? 'status-connected' : 'status-disconnected');
        }
        
        function resetCamera() {
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);
            controls.reset();
        }
        
        // Event listeners
        document.getElementById('viewMode').addEventListener('change', createDemoData);
        document.getElementById('showGrid').addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
        });
        document.getElementById('showAxes').addEventListener('change', (e) => {
            axesHelper.visible = e.target.checked;
        });
        
        // Keyboard controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'r' || e.key === 'R') {
                resetCamera();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Keyboard movement
            const speed = 0.1;
            if (keys['w']) camera.position.z -= speed;
            if (keys['s']) camera.position.z += speed;
            if (keys['a']) camera.position.x -= speed;
            if (keys['d']) camera.position.x += speed;
            if (keys['q']) camera.position.y += speed;
            if (keys['e']) camera.position.y -= speed;
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize
        window.loadData = loadData;
        window.resetCamera = resetCamera;
        
        updateStatus('準備完了', true);
        createDemoData();
        animate();
    </script>
</body>
</html>
