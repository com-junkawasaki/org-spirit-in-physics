[package]
name = "great-sprit"
version = "0.1.0"
edition = "2021"
authors = ["Jumma Kawasaki"]
description = "Great Spirit GPU Physics System - Real-time spirit position calculation with GPU acceleration"
license = "MIT"

[dependencies]
# GPU computing
wgpu = "0.20"
bytemuck = { version = "1.14", features = ["derive"] }

# Visualization (Bevy)
# Note: Using default features (libasound2-dev installed in Dockerfile for audio support)
bevy = { version = "0.13", default-features = true }

# GraphQL API
async-graphql = "6.0"
async-graphql-warp = "6.0"
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Vector math
nalgebra = "0.33"

# TerminusDB client
reqwest = { version = "0.12", features = ["json"] }

# Configuration
config = "0.14"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# ML/AI (for emotion analysis)
# Note: Candle and ONNX runtime will be added when models are integrated
# candle-core = "0.4"
# candle-nn = "0.4"
# onnxruntime = "0.1"  # or candle-onnx

# Image processing
image = "0.25"

# Audio processing
cpal = "0.15"
hound = "3.5"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# WASM support (optional, for browser deployment)
# wasm-bindgen = "0.2"
# web-sys = "0.3"

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"

[[bin]]
name = "great-sprit"
path = "src/main.rs"

