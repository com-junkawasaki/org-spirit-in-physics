# GraphQL Queries for Researcher Actor

query GetParticipants {
  participants {
    id
    age
    gender
    handedness
    createdAt
    updatedAt
  }
}

query GetParticipant($participantId: String!) {
  participant(participantId: $participantId) {
    id
    age
    gender
    handedness
    createdAt
    updatedAt
    sessionCount
    responseCount
    emotionDataCount
    physiologicalDataCount
  }
}

