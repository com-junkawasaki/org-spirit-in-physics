schema:
  # Use SDL file first (more reliable)
  - schema.graphql
  # Fallback to introspection endpoint if SDL file is not available
  - ${NEXT_PUBLIC_GRAPHQL_RUST_API_URL:-http://graphql:8080/graphql}

documents:
  - 'src/**/*.{ts,tsx}'
  - 'src/**/*.graphql'

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
      skipTypename: false
      enumsAsTypes: true
      # Allow codegen to succeed even if no documents are found
      ignoreNoDocuments: true
      scalars:
        DateTime: string
        JSON: any

