schema:
  # Use introspection endpoint (requires server to be running)
  - ${NEXT_PUBLIC_GRAPHQL_RUST_API_URL:-http://graphql:8080/graphql}
  # Fallback to SDL file if introspection is not available
  - schema.graphql

documents:
  - 'src/**/*.{ts,tsx}'
  - 'src/**/*.graphql'

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
      skipTypename: false
      enumsAsTypes: true
      # Allow codegen to succeed even if no documents are found
      ignoreNoDocuments: true
      scalars:
        DateTime: string
        JSON: any

