schema:
  # Use introspection endpoint (requires server to be running)
  - ${NEXT_PUBLIC_GRAPHQL_RUST_API_URL:-http://localhost:8080/graphql}
  # Fallback to SDL file if introspection is not available
  - ../../services/graphql/schema.graphql

documents:
  - 'src/**/*.{ts,tsx}'

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
      skipTypename: false
      enumsAsTypes: true
      scalars:
        DateTime: string
        JSON: any

