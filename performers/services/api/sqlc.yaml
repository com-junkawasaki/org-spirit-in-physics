version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "schema"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "float8"
            go_type: "float64"
          - column: "timeline_word_aggregates_by_session.sum_reaction_value"
            go_type: "float64"
          - column: "timeline_word_aggregates_by_session.sum_reaction_time"
            go_type: "float64"
          - column: "timeline_word_aggregates_by_session.sum_phys_abs"
            go_type: "float64"
          - column: "timeline_word_statistics_by_session.speed_index"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.joy_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.sadness_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.anger_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.fear_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.surprise_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.disgust_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.calm_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.focus_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.excitement_sum"
            go_type: "float64"
          - column: "timeline_emotion_vectors_by_word.confusion_sum"
            go_type: "float64"
