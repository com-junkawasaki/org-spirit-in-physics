syntax = "proto3";

package session.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/spirit-in-physics/services/grpc/gen/proto/session/v1;sessionv1";

// Session service
service SessionService {
  // Get sessions for a participant
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  
  // Create a new session
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
}

message GetSessionsRequest {
  string participant_id = 1;
}

message GetSessionsResponse {
  repeated Session sessions = 1;
}

message CreateSessionRequest {
  string participant_id = 1;
  optional int32 session_index = 2;
  int64 start_ts = 3;
  google.protobuf.Struct events = 4;
}

message CreateSessionResponse {
  Session session = 1;
}

message Session {
  string id = 1;
  string participant_id = 2;
  optional int32 session_index = 3;
  int64 start_ts = 4;
  optional int64 end_ts = 5;
  repeated google.protobuf.Struct events = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
