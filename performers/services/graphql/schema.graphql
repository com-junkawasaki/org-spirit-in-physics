type EmotionData {
	name: String!
	score: Float!
	fileType: String!
}

type Mutation {
	ping: String!
}

type ParticipantGQL {
	id: String!
	age: Int
	gender: String
	handedness: String
	createdAt: String!
	updatedAt: String!
	sessionCount: Int
	responseCount: Int
	emotionDataCount: Int
	physiologicalDataCount: Int
	averageSpiritProbability: Float
}

type ParticipantTimelineResponse {
	timelineData: [TimelineDataPoint!]!
	metadata: TimelineMetadata!
}

type PhysiologicalData {
	average: Float
	max: Float
	min: Float
}

type Query {
	participants: [ParticipantGQL!]!
	participant(participantId: String!): ParticipantGQL!
	participantTimeline(participantId: String!, sampleSize: Int): ParticipantTimelineResponse!
}

type TimelineDataPoint {
	timestamp: Float!
	word: String!
	reactionTime: Int!
	hasResponse: Boolean!
	emotions: [EmotionData!]!
	physiological: PhysiologicalData!
	reactionValue: Float!
	eventType: String
	metadata: TimelineDataPointMetadata
}

type TimelineDataPointMetadata {
	emotionCount: Int
	physiologicalCount: Int
}

type TimelineMetadata {
	sessionEvents: Int
	emotionEntries: Int
	physiologicalEntries: Int
	totalDataPoints: Int
	dataSource: String
	errors: [String!]
	truncated: Boolean
	originalSize: Int
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
