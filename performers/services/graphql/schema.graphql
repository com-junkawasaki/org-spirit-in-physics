scalar DateTime
scalar JSON

schema {
  query: Query
  mutation: Mutation
}

type Query {
  participants: [Participant!]! @juniper(ownership: "owned")
  participant(id: ID!): Participant @juniper(ownership: "owned")
  stimulusWords: [StimulusWord!]! @juniper(ownership: "owned")
  stimulusWord(id: Int!): StimulusWord @juniper(ownership: "owned")
  sessions(participantId: ID!): [Session!]! @juniper(ownership: "owned")
  timeline(
    participantId: ID!
    sessionId: ID
    startTime: String
    endTime: String
    interval: String
  ): [TimelinePoint!]! @juniper(ownership: "owned")
  wordAggregates(participantId: ID!, sessionId: ID): [WordAggregate!]! @juniper(ownership: "owned")
  emotionVectors(participantId: ID!, sessionId: ID): [EmotionVector!]! @juniper(ownership: "owned")
  wordStatistics(participantId: ID!, sessionId: ID): [WordStatistics!]! @juniper(ownership: "owned")
}

type Mutation {
  createParticipant(input: CreateParticipantInput!): Participant! @juniper(ownership: "owned")
  createSession(input: CreateSessionInput!): Session! @juniper(ownership: "owned")
  uploadArtifact(input: UploadArtifactInput!): String! @juniper(ownership: "owned")
}

type Participant {
  id: ID!
  age: Int
  gender: String
  handedness: String
  isPublic: Boolean!
  createdAt: String!
  updatedAt: String!
}

type Session {
  id: ID!
  participantId: ID!
  sessionIndex: Int
  startTs: Int!
  endTs: Int
  events: [JSON!]!
  createdAt: String!
  updatedAt: String!
}

type TimelinePoint {
  time: String!
  participantId: ID!
  sessionId: ID!
  word: String
  eventType: String
  reactionValue: Float
  reactionTime: Float
  hasResponse: Boolean!
  emotions: [EmotionData!]!
  physiological: [PhysiologicalData!]!
  metadata: JSON!
}

type EmotionData {
  name: String!
  score: Float!
  fileType: String!
  color: String
}

type PhysiologicalData {
  timestamp: String
  value: Float
  metadata: JSON
}

type StimulusWord {
  id: Int!
  japanese: String!
  english: String!
  pronunciation: String!
}

type WordAggregate {
  participantId: ID!
  sessionId: ID!
  word: String!
  count: Int!
  avgReactionValue: Float
  sumReactionValue: Float
  avgReactionTime: Float
  sumReactionTime: Float
  avgPhysiological: Float
  sumPhysAbs: Float
  physSeries: [Float]
  rtSeries: [Float]
  rvSeries: [Float]
  firstTime: String!
  lastTime: String!
}

type EmotionVector {
  participantId: ID!
  sessionId: ID!
  word: String!
  joySum: Float
  sadnessSum: Float
  angerSum: Float
  fearSum: Float
  surpriseSum: Float
  disgustSum: Float
  calmSum: Float
  focusSum: Float
  excitementSum: Float
  confusionSum: Float
  emotionEntryCount: Int!
  emotionByModality: JSON
}

type WordStatistics {
  participantId: ID!
  sessionId: ID!
  word: String!
  count: Int!
  avgReactionTime: Float
  stdReactionTime: Float
  varReactionTime: Float
  avgReactionValue: Float
  stdReactionValue: Float
  varReactionValue: Float
  avgPhysiological: Float
  stdPhysiological: Float
  varPhysiological: Float
  speedIndex: Float
  physSeries: [Float]
  rtSeries: [Float]
}

input CreateParticipantInput {
  id: ID
  signature: String!
  agreements: JSON!
  agreedAt: String!
  isPublic: Boolean
}

input CreateSessionInput {
  participantId: ID!
  sessionIndex: Int
  startTs: Int!
  events: JSON!
}

input UploadArtifactInput {
  participantId: ID!
  fileName: String!
  fileData: String!
  contentType: String!
  artifactType: String!
}
