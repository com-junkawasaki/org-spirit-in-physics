[package]
name = "graphql-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "graphql_service"
path = "src/lib.rs"

[[bin]]
name = "graphql"
path = "api/graphql.rs"

[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "graphql-schema"
path = "api/graphql/schema.rs"

[[bin]]
name = "graphql-service"
path = "src/main.rs"

[dependencies]
juniper = "0.14"
juniper-from-schema = "0.5.2"
poem = { version = "1.3", features = ["multipart", "websocket"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"], default-features = false }
base64 = "0.22"
vercel_runtime = "1"
jsonwebtoken = "9.2"
rsa = "0.9"
async-trait = "0.1"

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
tokio-test = "0.4"
