[package]
name = "graphql"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = "7.0"
async-graphql-warp = "7.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.1", features = ["postgres", "r2d2", "chrono", "uuid", "numeric"] }
diesel_migrations = "2.1"
dotenvy = "0.15"
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
warp = "0.3"
reqwest = { version = "0.12.24", features = ["json"] }
serde_json = "1.0.145"
rust_decimal = { version = "1.36", features = ["serde"] }
tokio-postgres = "0.7"
diesel-async = { version = "0.4", features = ["postgres", "deadpool"] }
lazy_static = "1.4"
vercel_blob = "0.1"

[[bin]]
name = "graphql"
path = "src/main.rs"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
wiremock = "0.6"
testcontainers = "0.16"
# Note: cargo-tarpaulin is installed via cargo, not as a dependency
