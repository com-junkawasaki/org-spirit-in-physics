syntax = "proto3";

package participant.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/spirit-in-physics/services/grpc/gen/proto/participant/v1;participantv1";

// Participant service
service ParticipantService {
  // Get all participants
  rpc GetParticipants(GetParticipantsRequest) returns (GetParticipantsResponse);
  
  // Get a participant by ID
  rpc GetParticipant(GetParticipantRequest) returns (GetParticipantResponse);
  
  // Create a new participant
  rpc CreateParticipant(CreateParticipantRequest) returns (CreateParticipantResponse);
  
  // Get a participant by email
  rpc GetParticipantByEmail(GetParticipantByEmailRequest) returns (GetParticipantByEmailResponse);

  // Get all stimulus words
  rpc GetStimulusWords(GetStimulusWordsRequest) returns (GetStimulusWordsResponse);
  
  // Get a stimulus word by ID
  rpc GetStimulusWord(GetStimulusWordRequest) returns (GetStimulusWordResponse);

  // --- Assessment Lifecycle (Temporal Integration) ---
  
  // Start or resume an assessment workflow
  rpc StartAssessment(StartAssessmentRequest) returns (StartAssessmentResponse);
  
  // Signal a word response to the workflow
  rpc SignalWordResponse(SignalWordResponseRequest) returns (SignalWordResponseResponse);
  
  // Signal start of a session
  rpc SignalStartSession(SignalStartSessionRequest) returns (SignalStartSessionResponse);
  
  // Signal an artifact (video/image) upload
  rpc SignalArtifact(SignalArtifactRequest) returns (SignalArtifactResponse);
  
  // Signal completion of the assessment
  rpc CompleteAssessment(CompleteAssessmentRequest) returns (CompleteAssessmentResponse);
  
  // Get current status of the assessment workflow
  rpc GetAssessmentStatus(GetAssessmentStatusRequest) returns (GetAssessmentStatusResponse);
}

message StartAssessmentRequest {
  string participant_id = 1;
  string email = 2;
  optional string age_group = 3;
  optional string gender = 4;
  optional string ethnicity = 5;
  optional string income_range = 6;
  repeated string medical_history = 7;
  optional string mode = 8; // quick, full, professional
}

message StartAssessmentResponse {
  string workflow_id = 1;
  string run_id = 2;
}

message SignalWordResponseRequest {
  string participant_id = 1;
  int32 stimulus_word_id = 2;
  string response_word = 3;
  int32 reaction_time_ms = 4;
}

message SignalWordResponseResponse {
  bool success = 1;
}

message SignalStartSessionRequest {
  string participant_id = 1;
  int32 session_number = 2;
}

message SignalStartSessionResponse {
  bool success = 1;
}

message SignalArtifactRequest {
  string participant_id = 1;
  string artifact_type = 2; // video, image, audio
  string url = 3;
  int32 session = 4;
}

message SignalArtifactResponse {
  bool success = 1;
}

message CompleteAssessmentRequest {
  string participant_id = 1;
}

message CompleteAssessmentResponse {
  bool success = 1;
}

message GetAssessmentStatusRequest {
  string participant_id = 1;
}

message GetAssessmentStatusResponse {
  string status = 1;
  int32 responses_count = 2;
  int32 artifacts_count = 3;
}

message GetParticipantsRequest {
  // Optional: filter by is_public (for unauthenticated users)
  optional bool is_public = 1;
}

message GetParticipantsResponse {
  repeated Participant participants = 1;
}

message GetParticipantRequest {
  string id = 1;
}

message GetParticipantResponse {
  Participant participant = 1;
}

message GetParticipantByEmailRequest {
  string email = 1;
}

message GetParticipantByEmailResponse {
  Participant participant = 1;
}

message CreateParticipantRequest {
  optional string id = 1;
  string email = 2;
  google.protobuf.Struct agreements = 3;
  google.protobuf.Timestamp agreed_at = 4;
  optional bool is_public = 5;
  optional string age_group = 6;
  optional string ethnicity = 7;
  optional string income_range = 8;
  repeated string medical_history = 9;
  optional string gender = 10;
}

message CreateParticipantResponse {
  Participant participant = 1;
}

message GetStimulusWordsRequest {}

message GetStimulusWordsResponse {
  repeated StimulusWord words = 1;
}

message GetStimulusWordRequest {
  int32 id = 1;
}

message GetStimulusWordResponse {
  StimulusWord word = 1;
}

message Participant {
  string id = 1;
  optional int32 age = 2;
  optional string gender = 3;
  optional string handedness = 4;
  optional string email = 12;
  optional string age_group = 8;
  optional string ethnicity = 9;
  optional string income_range = 10;
  repeated string medical_history = 11;
  bool is_public = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message StimulusWord {
  int32 id = 1;
  string japanese = 2;
  string english = 3;
  string french = 5;
  string spanish = 6;
  string russian = 7;
  string arabic = 8;
  string chinese = 9;
  string pronunciation = 4;
}
