syntax = "proto3";

package storage.v1;

option go_package = "github.com/spirit-in-physics/services/grpc/gen/proto/storage/v1;storagev1";

// Storage service for artifact uploads
service StorageService {
  // Upload an artifact (video, audio, etc.)
  rpc UploadArtifact(UploadArtifactRequest) returns (UploadArtifactResponse);
}

message UploadArtifactRequest {
  string participant_id = 1;
  string file_name = 2;
  bytes file_data = 3;
  string content_type = 4;
  string artifact_type = 5; // "video", "audio", "consent", "session_data"
}

message UploadArtifactResponse {
  string public_url = 1;
}
