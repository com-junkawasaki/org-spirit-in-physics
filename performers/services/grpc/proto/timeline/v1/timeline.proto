syntax = "proto3";

package timeline.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/spirit-in-physics/services/grpc/gen/proto/timeline/v1;timelinev1";

// Timeline service
service TimelineService {
  // Get timeline data for a participant
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
  
  // Get word aggregates by session
  rpc GetWordAggregates(GetWordAggregatesRequest) returns (GetWordAggregatesResponse);
  
  // Get emotion vectors by word
  rpc GetEmotionVectors(GetEmotionVectorsRequest) returns (GetEmotionVectorsResponse);
  
  // Get word statistics by session
  rpc GetWordStatistics(GetWordStatisticsRequest) returns (GetWordStatisticsResponse);

  // Get structure analysis results (run via Temporal)
  rpc GetAnalysis(GetAnalysisRequest) returns (GetAnalysisResponse);

  // Get integrated timeline data and analysis (run via TS Temporal)
  rpc GetIntegratedTimeline(GetIntegratedTimelineRequest) returns (GetIntegratedTimelineResponse);
}

message GetIntegratedTimelineRequest {
  string participant_id = 1;
  optional string session_id = 2;
}

message GetIntegratedTimelineResponse {
  repeated TimelinePoint points = 1;
  GetAnalysisResponse analysis = 2;
}

message GetAnalysisRequest {
  string participant_id = 1;
  optional string session_id = 2;
}

message GetAnalysisResponse {
  repeated GapArea gap_areas = 1;
  repeated DensityRegion density_regions = 2;
  repeated DuplicateCandidate duplicates = 3;
  double overall_density = 4;
}

message GapArea {
  string id = 1;
  repeated double center = 2; // [x, y, z]
  double radius = 3;
  repeated NearbyNode nearby_nodes = 4;
  repeated string suggested_items = 5;
  double confidence = 6;
  google.protobuf.Struct common_emotion_profile = 7;
}

message NearbyNode {
  string node_id = 1;
  string label = 2;
  double distance = 3;
  repeated string common_features = 4;
}

message DensityRegion {
  string id = 1;
  repeated double center = 2;
  double radius = 3;
  int32 node_count = 4;
  double density = 5;
  bool is_overcrowded = 6;
  optional double suggested_separation = 7;
}

message DuplicateCandidate {
  string id = 1;
  repeated string node_ids = 2;
  repeated string labels = 3;
  double similarity = 4;
  CommonFeatures common_features = 5;
  bool suggested_merge = 6;
  double distance = 7;
}

message CommonFeatures {
  google.protobuf.Struct emotion_profile = 1;
  repeated string semantic_tags = 2;
  repeated double frequency_range = 3;
  repeated double reaction_time_range = 4;
  repeated double reaction_value_range = 5;
}

message GetTimelineRequest {
  string participant_id = 1;
  optional string session_id = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;
  optional string interval = 5; // e.g., "1 hour", "1 day"
}

message GetTimelineResponse {
  repeated TimelinePoint points = 1;
}

message GetWordAggregatesRequest {
  string participant_id = 1;
  optional string session_id = 2;
}

message GetWordAggregatesResponse {
  repeated WordAggregate aggregates = 1;
}

message GetEmotionVectorsRequest {
  string participant_id = 1;
  optional string session_id = 2;
}

message GetEmotionVectorsResponse {
  repeated EmotionVector vectors = 1;
}

message GetWordStatisticsRequest {
  string participant_id = 1;
  optional string session_id = 2;
}

message GetWordStatisticsResponse {
  repeated WordStatistics statistics = 1;
}

message TimelinePoint {
  google.protobuf.Timestamp time = 1;
  string participant_id = 2;
  string session_id = 3;
  optional string word = 4;
  optional string event_type = 5;
  optional double reaction_value = 6;
  optional double reaction_time = 7;
  bool has_response = 8;
  repeated EmotionData emotions = 9;
  repeated PhysiologicalData physiological = 10;
  google.protobuf.Struct metadata = 11;
}

message EmotionData {
  string name = 1;
  double score = 2;
  string file_type = 3;
  optional string color = 4;
}

message PhysiologicalData {
  optional google.protobuf.Timestamp timestamp = 1;
  optional double value = 2;
  optional string measurement_type = 3;
  optional google.protobuf.Struct metadata = 4;
}

message WordAggregate {
  string participant_id = 1;
  string session_id = 2;
  string word = 3;
  int64 count = 4;
  optional double avg_reaction_value = 5;
  optional double sum_reaction_value = 6;
  optional double avg_reaction_time = 7;
  optional double sum_reaction_time = 8;
  optional double avg_physiological = 9;
  optional double sum_phys_abs = 10;
  repeated double phys_series = 11;
  repeated double rt_series = 12;
  repeated double rv_series = 13;
  google.protobuf.Timestamp first_time = 14;
  google.protobuf.Timestamp last_time = 15;
}

message EmotionVector {
  string participant_id = 1;
  string session_id = 2;
  string word = 3;
  optional double joy_sum = 4;
  optional double sadness_sum = 5;
  optional double anger_sum = 6;
  optional double fear_sum = 7;
  optional double surprise_sum = 8;
  optional double disgust_sum = 9;
  optional double calm_sum = 10;
  optional double focus_sum = 11;
  optional double excitement_sum = 12;
  optional double confusion_sum = 13;
  int64 emotion_entry_count = 14;
  optional google.protobuf.Struct emotion_by_modality = 15;
}

message WordStatistics {
  string participant_id = 1;
  string session_id = 2;
  string word = 3;
  int64 count = 4;
  optional double avg_reaction_time = 5;
  optional double std_reaction_time = 6;
  optional double var_reaction_time = 7;
  optional double avg_reaction_value = 8;
  optional double std_reaction_value = 9;
  optional double var_reaction_value = 10;
  optional double avg_physiological = 11;
  optional double std_physiological = 12;
  optional double var_physiological = 13;
  optional double speed_index = 14;
  repeated double phys_series = 15;
  repeated double rt_series = 16;
}
