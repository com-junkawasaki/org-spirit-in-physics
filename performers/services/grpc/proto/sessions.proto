syntax = "proto3";

package spirit_in_physics.sessions.v1;

import "common.proto";

// Session message
message Session {
  string id = 1; // UUID as string
  string participant_id = 2; // UUID as string
  optional int32 session_index = 3;
  int64 start_ts = 4; // Unix timestamp in milliseconds
  optional int64 end_ts = 5; // Unix timestamp in milliseconds
  repeated common.v1.JsonValue events = 6; // Array of JSON objects
  string created_at = 7; // RFC3339 timestamp
  string updated_at = 8; // RFC3339 timestamp
}

// Request to get sessions for a participant
message GetSessionsRequest {
  string participant_id = 1; // UUID as string
}

// Response with list of sessions
message GetSessionsResponse {
  repeated Session sessions = 1;
}

// Request to create a new session
message CreateSessionRequest {
  string participant_id = 1; // UUID as string
  optional int32 session_index = 2;
  int64 start_ts = 3; // Unix timestamp in milliseconds
  common.v1.JsonValue events = 4; // JSON array of events
}

// Response with created session
message CreateSessionResponse {
  Session session = 1;
}

// Session service definition
service SessionService {
  // Get sessions for a participant
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  
  // Create a new session
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
}

