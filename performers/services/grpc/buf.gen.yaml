version: v2
plugins:
  # Go code generation (Protobuf message types)
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/spirit-in-physics/services/grpc

  # Go code generation (Connect RPC)
  - local: protoc-gen-connect-go
    out: .
    opt:
      - module=github.com/spirit-in-physics/services/grpc
  
  # TypeScript code generation (Protobuf-ES)
  - local: protoc-gen-es
    out: gen/proto-ts
    opt:
      - target=ts
  
  # Connect-ES code generation (for Connect RPC clients)
  - local: protoc-gen-connect-es
    out: gen/proto-ts
    opt:
      - target=ts
