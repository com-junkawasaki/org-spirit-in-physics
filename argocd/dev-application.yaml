# Development用 ArgoCD Application
# Tilt との併用を想定した設定

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spirit-in-physics-dev
  namespace: argocd
  annotations:
    # Tilt による管理を示す
    tilt.dev/managed: "true"
spec:
  project: default
  
  source:
    repoURL: https://github.com/com-junkawasaki/spirit-in-physics.git
    targetRevision: main
    path: timoni
    
    plugin:
      name: timoni
      env:
        - name: RUNTIME_FILE
          value: runtime-orbstack.cue
        - name: BUNDLE_FILE
          value: bundle.cue
  
  destination:
    server: https://kubernetes.default.svc
    namespace: spirit-in-physics
  
  syncPolicy:
    automated:
      prune: false  # Tilt が管理するため無効化
      selfHeal: false  # Tilt の変更を許可
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Tilt が管理するリソースを無視
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jqPathExpressions:
        - .metadata.annotations["tilt.dev/update-mode"]
        - .metadata.annotations["tilt.dev/resource-id"]
        - .metadata.labels["tilt.dev/resource"]

