apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  configManagementPlugins: |
    - name: timoni
      generate:
        command: [sh, -c]
        args:
          - |
            timoni bundle build \
              -f ${BUNDLE_FILE:-bundle.cue} \
              -r ${RUNTIME_FILE:-runtime-gke.cue}

