          value: infra-temporal:7233
        - name: TASK_QUEUE
          value: visualization-analysis-queue
        image: spirit-temporal-ts:latest
        imagePullPolicy: IfNotPresent
        name: temporal-ts
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
            drop:
            - ALL
          privileged: false
      serviceAccountName: temporal-ts
