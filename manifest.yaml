    metadata:
      labels:
        app.kubernetes.io/name: grpc-service
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@infra-timescaledb:5432/spirit_in_physics
        - name: TEMPORAL_ADDRESS
          value: infra-temporal:7233
        - name: MINIO_ENDPOINT
          value: infra-minio:9000
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        - name: LAKEFS_ENDPOINT
          value: http://infra-lakefs:8000
        - name: LAKEFS_ACCESS_KEY_ID
          value: AKIAIOSFODNN7EXAMPLE
        - name: LAKEFS_SECRET_ACCESS_KEY
          value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        - name: LAKEFS_REPOSITORY
          value: spirit-in-physics
