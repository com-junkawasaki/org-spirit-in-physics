            - CHOWN
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
            drop:
            - ALL
          privileged: false
        volumeMounts:
        - mountPath: /dataset
          name: dataset
      serviceAccountName: grpc-service
      volumes:
      - hostPath:
          path: /Volumes/251214/jun784/spirit-in-physics/dataset/participants
          type: Directory
        name: dataset

