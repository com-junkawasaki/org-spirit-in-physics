apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Gateway
      name: infra-gateway
    patch: |-
      - op: add
        path: /metadata/annotations/networking.gke.io/static-ip
        value: sip-static-ip
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
