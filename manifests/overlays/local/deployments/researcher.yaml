apiVersion: apps/v1
kind: Deployment
metadata:
  name: researcher
  namespace: spirit-in-physics
  labels:
    app.kubernetes.io/name: researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: researcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: researcher
    spec:
      serviceAccountName: researcher
      containers:
      - name: researcher
        image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/researcher:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PUBLIC_API_URL
          value: http://localhost:8080
        - name: PUBLIC_CLERK_PUBLISHABLE_KEY
          value: pk_test_placeholder
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
