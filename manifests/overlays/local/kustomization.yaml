apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core resources for local development
# Excludes: Gateway API, cert-manager, GCS bucket, IAM, Temporal
resources:
  - ../../base/namespace.yaml
  - ../../base/serviceaccounts/api.yaml
  - ../../base/serviceaccounts/importer.yaml
  - ../../base/serviceaccounts/www.yaml
  - ../../base/services/api.yaml
  - ../../base/services/importer.yaml
  - ../../base/services/infra-timescaledb.yaml
  - ../../base/services/www.yaml
  - ../../base/deployments/api.yaml
  - ../../base/deployments/importer.yaml
  - ../../base/deployments/www.yaml
  - ../../base/statefulsets/infra-timescaledb.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: www
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://localhost:8080
