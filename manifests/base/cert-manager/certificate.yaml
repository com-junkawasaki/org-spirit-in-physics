apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sip-tls-cert
  namespace: spirit-in-physics
  annotations:
    # Config Sync による管理を明示
    configmanagement.gke.io/managed: enabled
    # cert-manager の再試行設定
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  commonName: spirit-in-physics.com
  dnsNames:
  - spirit-in-physics.com
  - sip.junkawasaki.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: sip-tls-cert
  # 証明書の有効期限の管理
  renewBefore: 720h # 30日前に更新を開始
  # 失敗したチャレンジの自動再試行（cert-managerのデフォルト動作）
  duration: 2160h # 90日間有効
