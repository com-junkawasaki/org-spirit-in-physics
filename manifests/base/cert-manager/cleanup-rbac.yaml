apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-cleanup
  namespace: spirit-in-physics
  annotations:
    configmanagement.gke.io/managed: enabled
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-cleanup
  namespace: spirit-in-physics
  annotations:
    configmanagement.gke.io/managed: enabled
rules:
- apiGroups:
  - acme.cert-manager.io
  resources:
  - challenges
  verbs:
  - get
  - list
  - delete
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-cleanup
  namespace: spirit-in-physics
  annotations:
    configmanagement.gke.io/managed: enabled
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-cleanup
subjects:
- kind: ServiceAccount
  name: cert-manager-cleanup
  namespace: spirit-in-physics

