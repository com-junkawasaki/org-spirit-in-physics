apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-ts
  namespace: spirit-in-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dapr-ts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dapr-ts
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dapr-ts"
        dapr.io/app-port: "3002"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - env:
        - name: APP_PORT
          value: "3002"
        - name: DAPR_HTTP_PORT
          value: "3500"
        image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/dapr-ts:latest
        name: dapr-ts
        ports:
        - containerPort: 3002
          name: http
