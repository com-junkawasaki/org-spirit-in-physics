apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: temporal-ts
    app.kubernetes.io/version: 0.0.0-devel
  name: temporal-ts
  namespace: spirit-in-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ts
    spec:
      containers:
      - env:
        - name: TEMPORAL_ADDRESS
          value: infra-temporal:7233
        - name: TASK_QUEUE
          value: visualization-analysis-queue
        image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/temporal-ts:latest
        imagePullPolicy: IfNotPresent
        name: temporal-ts
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
            drop:
            - ALL
          privileged: false
      serviceAccountName: temporal-ts

