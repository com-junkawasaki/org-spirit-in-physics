apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: spirit-in-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      containers:
      - env:
        - name: PUBLIC_CLERK_PUBLISHABLE_KEY
          value: pk_live_Y2xlcmsuZ2Z0ZC5kZXYk
        - name: PUBLIC_API_URL
          value: https://spirit-in-physics.com/api
        image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/svelte-app:latest
        name: portal
        ports:
        - containerPort: 80
          name: http
