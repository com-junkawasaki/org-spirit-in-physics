apiVersion: apps/v1
kind: Deployment
metadata:
  name: researcher
  namespace: spirit-in-physics
  labels:
    app.kubernetes.io/name: researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: researcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: researcher
    spec:
      serviceAccountName: researcher
      containers:
      - name: researcher
        image: asia-northeast1-docker.pkg.dev/com-junkawasaki-sip/spirit-in-physics/researcher:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PUBLIC_API_URL
          value: https://spirit-in-physics.com/api
        - name: PUBLIC_CLERK_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: clerk-secrets
              key: publishable-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
