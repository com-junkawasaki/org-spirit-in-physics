apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: researcher-tls-cert
  namespace: spirit-in-physics
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  commonName: researcher.spirit-in-physics.com
  dnsNames:
  - researcher.spirit-in-physics.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: researcher-tls-cert
  renewBefore: 720h
  duration: 2160h
