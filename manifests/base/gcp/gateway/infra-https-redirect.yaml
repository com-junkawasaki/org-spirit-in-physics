apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infra-https-redirect
  namespace: spirit-in-physics
spec:
  hostnames:
  - spirit-in-physics.com
  - sip.junkawasaki.com
  - researcher.spirit-in-physics.com
  parentRefs:
  - name: infra-gateway
    namespace: spirit-in-physics
    sectionName: http-0
  - name: infra-gateway
    namespace: spirit-in-physics
    sectionName: researcher-http
  rules:
  # ACME チャレンジはリダイレクトしない（cert-manager が処理）
  # cert-manager の gatewayHTTPRoute solver が自動的にルートを作成する
  # その他のHTTPリクエストをHTTPSにリダイレクト
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
