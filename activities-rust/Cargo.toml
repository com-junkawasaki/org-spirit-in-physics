[package]
name = "spirit-in-physics-activities"
version = "0.1.0"
edition = "2021"
authors = ["Spirit in Physics Team"]
description = "Rust implementation of activities for Spirit in Physics workflow engine"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for Supabase and external APIs
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID support
uuid = { version = "1.10", features = ["v4", "serde"] }

# DateTime support
chrono = { version = "0.4", features = ["serde"] }

# Async trait support
async-trait = "0.1"

# HTTP server (for exposing activities as HTTP API)
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Database client (PostgreSQL/Supabase)
# Using reqwest for HTTP API calls to Supabase instead of direct postgres connection
# sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "spirit_activities"
path = "src/lib.rs"

[[bin]]
name = "activities-server"
path = "src/main.rs"

