version: v1
plugins:
  - name: es
    out: apps/svelte-app/src/generated/proto
    opt: target=ts
    path: apps/svelte-app/node_modules/.bin/protoc-gen-es
  - name: connect-es
    out: apps/svelte-app/src/generated/proto
    opt: target=ts
    path: apps/svelte-app/node_modules/.bin/protoc-gen-connect-es
